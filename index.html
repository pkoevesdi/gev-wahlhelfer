<meta charset="utf-8">
<title>GEV-Wahlhelfer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<!-- Papa Parse 5.4.1, MIT, liegt im Ordner. Nur falls das nicht geladen werden darf
     — etwa unter einer strengen Sicherheitsregel — kommt es von cdnjs. -->
<script src="papaparse.min.js"></script>
<script>
  if (typeof Papa === "undefined")
    document.write('<scr' + 'ipt src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"><\/scr' + 'ipt>');
</script>
<style>
  :root{
    --ground:#FBFBFC; --panel:#FFFFFF; --ink:#16181D; --muted:#5C6270; --faint:#8A90A0;
    --line:#DFE1E7; --line-soft:#ECEEF2; --accent:#1F4FA3; --accent-soft:#E7EDF8;
    --elected:#1E6E4B; --elected-soft:#E3F1EA; --warn:#9A6B12; --warn-soft:#FAF0DC;
    --shadow:0 1px 2px rgba(22,24,29,.06), 0 8px 24px rgba(22,24,29,.05);
    --display:"Libre Franklin", "Helvetica Neue", Arial, sans-serif;
    --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#14161A; --panel:#1B1E24; --ink:#EEF0F4; --muted:#A2A9B8; --faint:#79808F;
      --line:#2A2E36; --line-soft:#23272E; --accent:#7FA8EE; --accent-soft:#1E2938;
      --elected:#5FBF92; --elected-soft:#17291F; --warn:#D9A648; --warn-soft:#2B2417;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#14161A; --panel:#1B1E24; --ink:#EEF0F4; --muted:#A2A9B8; --faint:#79808F;
    --line:#2A2E36; --line-soft:#23272E; --accent:#7FA8EE; --accent-soft:#1E2938;
    --elected:#5FBF92; --elected-soft:#17291F; --warn:#D9A648; --warn-soft:#2B2417;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ground); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0;}
  button{font:inherit; color:inherit; cursor:pointer;}
  input,select{font:inherit; color:inherit;}
  .wrap{display:grid; grid-template-columns:288px minmax(0,1fr); min-height:100%;}
  body.beamer .wrap{grid-template-columns:minmax(0,1fr);}
  body.beamer .rail{display:none;}
  body.beamer .leiste{display:none;}   /* im Beamermodus bleibt nur der Wahlgang stehen */

  /* ---- Schiene ---- */
  .rail{border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:100%;}
  .rail-kopf{padding:16px; border-bottom:1px solid var(--line);}
  .marke{font-family:var(--display); font-weight:800; font-size:16px; letter-spacing:-.01em;}
  .marke span{color:var(--accent);}
  .rail-liste{flex:1; overflow-y:auto; padding:8px 8px 20px;}
  .wg{display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:0;
    border-radius:7px; padding:8px 9px; color:var(--ink); line-height:1.25;}
  .wg:hover{background:var(--line-soft);}
  .wg[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .wg .punkt{width:8px; height:8px; border-radius:50%; flex:none; border:1.5px solid var(--faint);}
  .wg.offen .punkt{border-color:var(--faint);}
  .wg.laeuft .punkt{border-color:var(--warn); background:var(--warn);}
  .wg.fertig .punkt{border-color:var(--elected); background:var(--elected);}
  .wg .txt{flex:1; min-width:0; font-size:13.5px;}
  .wg .sitze{font-family:var(--mono); font-size:11px; color:var(--faint);}

  /* ---- Bühne ---- */
  .buehne{display:flex; flex-direction:column; min-width:0;}
  .leiste{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; display:flex; flex-wrap:wrap;
    align-items:center; gap:8px; padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--line);}
  .leiste .lücke{flex:1}
  .knopf{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 13px; font-size:13.5px; font-weight:500;}
  .knopf:hover{border-color:var(--accent); color:var(--accent);}
  .knopf.stark{background:var(--accent); border-color:var(--accent); color:#fff;}
  .knopf.stark:hover{filter:brightness(1.08); color:#fff;}
  .knopf:disabled{opacity:.45; cursor:not-allowed;}
  .knopf.warnknopf{border-color:var(--warn); color:var(--warn); font-weight:600;}
  .status{font-size:12.5px; color:var(--muted);}
  .status b{font-family:var(--mono); color:var(--ink); font-weight:600;}

  .flaeche{flex:1; padding:26px 20px 60px; max-width:1100px; width:100%; margin:0 auto;}
  body.beamer .flaeche{max-width:1500px; padding-top:34px;}

  .kopfzeile{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:4px;}
  .eyebrow{font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); font-weight:600;}
  h2.titel{font-size:clamp(26px,3.6vw,40px); font-weight:800; letter-spacing:-.02em; line-height:1.12;}
  body.beamer h2.titel{font-size:clamp(34px,4.6vw,58px);}
  .unterzeile{color:var(--muted); font-size:14.5px; margin-top:6px;}
  body.beamer .unterzeile{font-size:18px;}

  .hinweis{margin-top:14px; border-left:3px solid var(--warn); background:var(--warn-soft); color:var(--warn);
    padding:9px 13px; border-radius:0 7px 7px 0; font-size:13px;}

  /* ---- Block je Wahlgang ---- */
  .block{margin-top:30px; padding-top:22px; border-top:1px solid var(--line);}
  .block:first-of-type{border-top:0; padding-top:0; margin-top:22px;}
  .blockkopf{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .blocktitel{font-size:19px; font-weight:600; letter-spacing:-.01em;}
  body.beamer .blocktitel{font-size:27px;}
  .blocksitze{font-family:var(--mono); font-size:12px; color:var(--faint);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px;}
  .blockzeile{color:var(--muted); font-size:13.5px; margin-top:3px;}
  body.beamer .blockzeile{font-size:16px;}

  /* ---- Kandidatentabelle ---- */
  .tabelle{margin-top:14px; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--panel); box-shadow:var(--shadow);}
  .treihe{display:grid; grid-template-columns:34px minmax(0,1fr) 128px 70px; align-items:center; gap:12px;
    padding:13px 16px; border-top:1px solid var(--line-soft);}
  .zeilknoepfe{display:flex; gap:2px; justify-content:flex-end;}
  .zk{border:0; background:none; color:var(--faint); font-size:16px; line-height:1; padding:5px 6px; border-radius:6px;}
  .zk:hover:not(:disabled){background:var(--line-soft); color:var(--elected);}
  .zk.weg:hover{color:var(--warn);}
  .zk:disabled{opacity:.3; cursor:not-allowed;}
  .treihe:first-child{border-top:0;}
  .treihe.kopf{background:var(--line-soft); padding-block:9px; border-top:0;}
  .treihe.kopf span{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:600;}
  .rang{font-family:var(--mono); font-size:15px; color:var(--faint); text-align:right;}
  .kname{font-size:17px; font-weight:500; overflow-wrap:anywhere;}
  body.beamer .kname{font-size:24px;}
  body.beamer .treihe{padding:17px 20px;}
  body.beamer .rang{font-size:20px;}
  .kmail{font-size:12.5px; color:var(--faint); overflow-wrap:anywhere;}
  .stimmen{width:100%; font-family:var(--mono); font-size:19px; font-weight:600; text-align:right;
    border:1px solid var(--line); border-radius:7px; padding:6px 10px; background:var(--ground);}
  body.beamer .stimmen{font-size:26px;}
  .stimmen:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .treihe.gewaehlt{background:var(--elected-soft);}
  .treihe.gewaehlt .rang{color:var(--elected); font-weight:600;}
  .marke-gewaehlt{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--elected); font-weight:600;}
  .leerzeile{padding:26px 16px; color:var(--faint); font-size:14px; text-align:center;}

  /* ---- Kandidat aufnehmen ---- */
  .aufnahme{margin-top:16px; position:relative;}
  .suchfeld{width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 14px; font-size:15px; background:var(--panel);}
  .suchfeld:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .treffer{position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:9; background:var(--panel);
    border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); max-height:320px; overflow-y:auto;}
  .treffer button{display:flex; width:100%; align-items:baseline; gap:10px; text-align:left; background:none;
    border:0; border-top:1px solid var(--line-soft); padding:9px 14px;}
  .treffer button:first-child{border-top:0;}
  .treffer button:hover,.treffer button.aktiv{background:var(--accent-soft);}
  .treffer .tn{font-weight:500;}
  .treffer .tk{font-family:var(--mono); font-size:11.5px; color:var(--faint);}
  .treffer .tr{margin-left:auto; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint);}
  .treffer .tr.nein{color:var(--warn);}

  /* ---- Abgegebene Stimmen ---- */
  .fussleiste{margin-top:18px; display:flex; flex-wrap:wrap; gap:16px 26px; align-items:center;
    font-size:13.5px; color:var(--muted);}
  .fussleiste label{display:flex; align-items:center; gap:9px;}
  .fussleiste input{width:88px; font-family:var(--mono); text-align:right; border:1px solid var(--line);
    border-radius:7px; padding:6px 9px; background:var(--panel);}

  /* ---- Einrichtung ---- */
  .karten{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); margin-top:20px;}
  .karte{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:16px; box-shadow:var(--shadow);}
  .karte h3{font-size:14px; font-weight:600; letter-spacing:-.01em;}
  .karte p{color:var(--muted); font-size:13px; margin:6px 0 12px;}
  .feld{display:block; margin-top:10px;}
  .feld span{display:block; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:4px;}
  .feld input{width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 11px; background:var(--ground);}
  .datei{display:inline-flex; align-items:center; gap:8px;}
  .datei input{display:none;}
  .zahl{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .liste-info{font-size:13px; color:var(--muted); margin-top:10px;}
  .liste-info b{color:var(--ink); font-family:var(--mono);}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  @media (max-width:820px){
    .wrap{grid-template-columns:minmax(0,1fr);}
    .rail{border-right:0; border-bottom:1px solid var(--line); min-height:0;}
    .rail-liste{max-height:230px;}
    .treihe{grid-template-columns:28px minmax(0,1fr) 92px 62px; gap:8px; padding:11px 12px;}
    .flaeche{padding:20px 16px 50px;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>

<div class="wrap">
  <aside class="rail">
    <div class="rail-kopf">
      <div class="marke">GEV<span>·</span>Wahlhelfer</div>
    </div>
    <div class="rail-liste" id="rail"></div>
  </aside>

  <main class="buehne">
    <div class="leiste">
      <button class="knopf" id="btnEinrichtung">Einrichtung</button>
      <button class="knopf" id="btnBeamer">Beamer</button>
      <span class="lücke"></span>
      <span class="status" id="status">Mitgliederliste noch nicht geladen</span>
      <button class="knopf stark" id="btnStand">Stand sichern</button>
    </div>
    <div class="flaeche" id="flaeche"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ================= Wahlgänge ================= */
  // Ein Bild je Gremium, darin Hauptamt und Stellvertretung als eigene Wahlgänge.
  // zusatz:true = für diesen Wahlgang hat die amtliche Vorlage keine Seite.
  const GREMIEN = [
    {gruppe:"Gesamtelternvertretung", id:"vorstand", titel:"Elternsprecher:in der Schule", teile:[
      {id:"vorsitz",        label:"Elternsprecher:in", sitze:1, hinweis:"zugleich Vorsitz der GEV"},
      {id:"stellv_vorsitz", label:"Stellvertretung",   sitze:3, hinweis:"mindestens eine, höchstens drei Personen"}]},
    {gruppe:"Schulkonferenz", id:"skseite", titel:"Schulkonferenz", teile:[
      {id:"sk",        label:"Mitglieder",      sitze:4, hinweis:"zwei Schuljahre"},
      {id:"sk_stellv", label:"Stellvertretung", sitze:8, hinweis:"Reihenfolge nach Stimmenzahl"}]},
    {gruppe:"GEV-Vorstand", id:"vorstand_weitere", titel:"Weitere Mitglieder im Vorstand", teile:[
      {id:"vorstand_weitere", label:"Weitere Mitglieder", sitze:null, zusatz:true,
       hinweis:"Für diesen Wahlgang kennt die amtliche Vorlage keine Seite. Das Protokoll bekommt dafür eine zusätzliche Seite im gleichen Aufbau."}]},
    {gruppe:"Bezirkselternausschuss", id:"beaseite", titel:"Bezirkselternausschuss", teile:[
      {id:"bea",        label:"Mitglieder",      sitze:2, hinweis:"zwei Schuljahre"},
      {id:"bea_stellv", label:"Stellvertretung", sitze:4, hinweis:"Reihenfolge nach Stimmenzahl"}]},
    {gruppe:"Gesamtkonferenz", id:"gkseite", titel:"Gesamtkonferenz", teile:[
      {id:"gk",        label:"Beratende Mitglieder", sitze:2, hinweis:"ein Schuljahr"},
      {id:"gk_stellv", label:"Stellvertretung",      sitze:4}]},
    {gruppe:"Gesamtschülervertretung", id:"gsvseite", titel:"Gesamtschülervertretung", teile:[
      {id:"gsv",        label:"Beratende Mitglieder", sitze:2},
      {id:"gsv_stellv", label:"Stellvertretung",      sitze:4}]}
  ];
  const TEILKONFERENZ = {gruppe:"Teilkonferenz", id:"tkseite", titel:"Teilkonferenz", teile:[
      {id:"tk",        label:"Mitglied",        sitze:1},
      {id:"tk_stellv", label:"Stellvertretung", sitze:2}]};

  const S = {
    kopf:{schule:"", datum:heuteISO(), wahlleitung:"", anwesendW:"", anwesendS:"", teilkonferenz:""},
    mitglieder:[], faecher:[], wahlgaenge:{}, aktiv:"vorsitz", ansicht:"wahlgang", listeName:""
  };
  // Namen kommen ausschliesslich aus der geladenen Datei und bleiben im Browser
  // dieses Rechners. Die Seite selbst speichert nichts ausserhalb.
  const SCHLUESSEL = "gev-wahlhelfer";
  const SCHLUESSEL_ALT = "gev-wahlgang";   // früherer Name, wird noch gelesen
  let downloads=null, speicherTimer=null, treffAktiv=-1;

  function heuteISO(){ const d=new Date(); return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); }
  function el(t,k,x){ const n=document.createElement(t); if(k) n.className=k; if(x!=null) n.textContent=x; return n; }
  function wgListe(){
    const fk=[];
    for(const f of S.faecher){
      fk.push({gruppe:"Fachkonferenzen", id:"fkseite::"+f, titel:"Fachkonferenz "+f, teile:[
        {id:"fk::"+f,  label:"Beratende Mitglieder", sitze:2},
        {id:"fks::"+f, label:"Stellvertretung",      sitze:4}]});
    }
    const tk = String(S.kopf.teilkonferenz||"").trim() ? [TEILKONFERENZ] : [];
    return GREMIEN.concat(fk, tk);
  }
  function alleTeile(){ return wgListe().reduce((a,s)=>a.concat(s.teile),[]); }
  function teilVon(id){ return alleTeile().find(t=>t.id===id); }
  function daten(id){ if(!S.wahlgaenge[id]) S.wahlgaenge[id]={kandidaten:[], abgegeben:"", sitze:null}; return S.wahlgaenge[id]; }
  // sitze:null heißt offen — die Zahl wird erst in der Versammlung beschlossen
  function sitzeVon(t){
    const d=daten(t.id);
    if(d.sitze!=null && d.sitze!=="") return Number(d.sitze);
    return t.sitze==null ? Infinity : t.sitze;
  }
  function sitzeText(t){ const n=sitzeVon(t); return n===Infinity ? "offen" : n+(n===1?" Sitz":" Sitze"); }
  function sitzeFuer(id){ const t=teilVon(id); return t ? sitzeVon(t) : 1; }
  function sortiert(id){ return daten(id).kandidaten.slice().sort((a,b)=> (Number(b.stimmen)||0)-(Number(a.stimmen)||0)); }
  function statusTeil(t){
    const d=daten(t.id);
    if(!d.kandidaten.length) return "offen";
    return d.kandidaten.some(k=>k.stimmen!=="" && k.stimmen!=null) ? "fertig" : "laeuft";
  }
  function statusVon(seite){
    const st=seite.teile.map(statusTeil);
    if(st.every(x=>x==="fertig")) return "fertig";
    if(st.every(x=>x==="offen"))  return "offen";
    return "laeuft";
  }

  /* ================= Mitgliederliste ================= */
  function spalteSuchen(zeilen, texte, zeilenIdx){
    for(const r of zeilenIdx){
      const z = zeilen[r]||[];
      for(let c=0;c<z.length;c++){
        const v=String(z[c]==null?"":z[c]).replace(/\s+/g," ").trim().toLowerCase();
        if(texte.some(t=> v===t.toLowerCase())) return c;
      }
    }
    return -1;
  }
  // Auszug: eine Zeile je Vertreter. Pflicht ist nur »Name«; »Klasse«
  // (früher »Herkunftsgremium«), »Vorname« und »E-Mail« ergänzen, wenn vorhanden. Eine Spalte »Typ« mit dem
  // Wert »Fachkonferenz« nimmt die Fächer mit auf, muss es aber nicht.
  function auszugLesen(zeilen){
    const kopf=(zeilen[0]||[]).map(v=>String(v==null?"":v).trim().toLowerCase());
    const sp=n=>kopf.indexOf(n);
    const cNam=sp("name");
    if(cNam<0 || sp("gev-mitglied")>=0) return null;   // leer oder volle Mitgliederliste
    const cTyp=sp("typ"), cVor=sp("vorname"), cMail=sp("e-mail");
    const cGrem=sp("klasse")>=0 ? sp("klasse") : sp("herkunftsgremium");
    const leute=[], faecher=[];
    for(let r=1;r<zeilen.length;r++){
      const z=zeilen[r]||[];
      const nam=String(z[cNam]==null?"":z[cNam]).trim();
      if(!nam) continue;
      const typ=cTyp>=0 ? String(z[cTyp]==null?"":z[cTyp]).trim().toLowerCase() : "";
      if(typ.startsWith("fachkonferenz")){ if(!faecher.includes(nam)) faecher.push(nam); continue; }
      const vor=String((cVor>=0?z[cVor]:"")||"").trim();
      leute.push({vorname:vor, name:nam, voll:(vor?vor+" ":"")+nam,
                  klasse:String((cGrem>=0?z[cGrem]:"")||"").trim(),
                  mail:String((cMail>=0?z[cMail]:"")||"").trim(),
                  vertreter:true, stellv:false});
    }
    return leute.length ? {leute, faecher} : null;
  }
  function listeLesen(zeilen){
    const idx=[0,1,2,3,4,5,6];
    const cGrem=spalteSuchen(zeilen,["Klasse","Herkunftsgremium"],idx);
    const cVor =spalteSuchen(zeilen,["Vorname"],idx);
    const cNam =spalteSuchen(zeilen,["Name"],idx);
    const cMail=spalteSuchen(zeilen,["E-Mail"],idx);
    const cMit =spalteSuchen(zeilen,["GEV-Mitglied"],idx);
    const cStv =spalteSuchen(zeilen,["Stellv. GEV-Mitglied"],idx);
    const cFk  =spalteSuchen(zeilen,["Mitglied FKn"],idx);
    const cFks =spalteSuchen(zeilen,["stellv. Mitglied FKn"],idx);
    if(cNam<0 || cMit<0) throw new Error("Spalten »Name« und »GEV-Mitglied« nicht gefunden — ist das die Mitgliederliste?");
    const kopfZeile = zeilen.findIndex(z=> String((z||[])[cNam]||"").trim()==="Name");
    const leute=[], faecher=[];
    for(let r=kopfZeile+1;r<zeilen.length;r++){
      const z=zeilen[r]||[];
      const nam=String(z[cNam]==null?"":z[cNam]).trim();
      if(!nam) continue;
      const mit=String(z[cMit]==null?"":z[cMit]).trim();
      const stv=String(z[cStv]==null?"":z[cStv]).trim();
      const istV=/x/i.test(mit), istS=/x/i.test(stv);
      if(!istV && !istS) continue;
      const vor=String((cVor>=0?z[cVor]:"")||"").trim();
      leute.push({
        vorname:vor, name:nam, voll:(vor?vor+" ":"")+nam,
        klasse:String((cGrem>=0?z[cGrem]:"")||"").trim(),
        mail:String((cMail>=0?z[cMail]:"")||"").trim(),
        vertreter:istV, stellv:istS
      });
      for(const c of [cFk,cFks]){
        if(c<0) continue;
        String(z[c]==null?"":z[c]).split(",").map(s=>s.trim()).filter(Boolean)
          .forEach(f=>{ if(!faecher.includes(f)) faecher.push(f); });
      }
    }
    return {leute, faecher};
  }
  // CSV liest Papa Parse: Trennzeichen wird erkannt, Anführungszeichen,
  // eingebettete Trennzeichen und Zeilenumbrüche inbegriffen.
  function csvLesen(text){
    const e = Papa.parse(text.replace(/^\uFEFF/, ""), {skipEmptyLines:false});
    return e.data.map(z => z.map(f => String(f == null ? "" : f).trim()));
  }
  async function dateiLaden(file){
    const zeilen=csvLesen(await file.text());
    const erg = auszugLesen(zeilen) || listeLesen(zeilen);
    if(!erg || !erg.leute.length) throw new Error("In der Datei stehen keine Vertreter.");
    // Beim Laden einer Liste bleiben frei eingetippte Namen erhalten
    const frei=S.mitglieder.filter(m=>m.frei && !erg.leute.some(l=>l.voll===m.voll));
    S.mitglieder=erg.leute.concat(frei); S.listeName=file.name;
    // Schon aufgestellte Kandidaturen nachversorgen: fehlt eine Adresse oder die
    // Klasse, wird sie aus der neu geladenen Liste ergänzt. Stimmen bleiben stehen,
    // damit eine nachgereichte Adresse das laufende Protokoll nicht kostet.
    let ergaenzt=0;
    for(const wg of Object.values(S.wahlgaenge||{})){
      for(const k of (wg.kandidaten||[])){
        const m=erg.leute.find(l=>l.voll===k.name);
        if(!m) continue;
        if(!k.mail && m.mail){ k.mail=m.mail; ergaenzt++; }
        if(!k.klasse && m.klasse) k.klasse=m.klasse;
      }
    }
    S.nachversorgt = ergaenzt;
    // Bringt die Datei keine Fächer mit, bleiben die eingetragenen stehen
    if(erg.faecher.length) S.faecher=erg.faecher;
    sichern(); zeichnen();
  }

  /* ================= Sichern ================= */
  function nutzdaten(){
    return {kopf:S.kopf, mitglieder:S.mitglieder, faecher:S.faecher,
            wahlgaenge:S.wahlgaenge, aktiv:S.aktiv, listeName:S.listeName};
  }
  async function verbinden(){
    try{ downloads = await window.claude?.use?.("downloads") ?? null; }catch(e){ downloads=null; }
    zeichnen();
  }
  function sichern(){
    clearTimeout(speicherTimer);
    speicherTimer=setTimeout(()=>{
      try{ localStorage.setItem(SCHLUESSEL, JSON.stringify(nutzdaten())); }catch(e){}
    },500);
  }
  function wiederherstellen(){
    try{
      const roh=localStorage.getItem(SCHLUESSEL) || localStorage.getItem(SCHLUESSEL_ALT);
      if(!roh) return;
      const d=JSON.parse(roh);
      if(d && d.kopf) Object.assign(S,d);
    }catch(e){}
  }
  function stand(){
    return new Blob([JSON.stringify(nutzdaten(),null,1)],{type:"application/json"});
  }

  /* ================= Schiene ================= */
  function railZeichnen(){
    const rail=document.getElementById("rail"); rail.innerHTML="";
    for(const w of wgListe()){
      const btn=el("button","wg "+statusVon(w));
      btn.setAttribute("aria-current", S.aktiv===w.id && S.ansicht==="wahlgang" ? "true":"false");
      btn.append(el("span","punkt"),
                 el("span","txt", w.titel),
                 el("span","sitze", w.teile.map(t=> sitzeVon(t)===Infinity ? "offen" : sitzeVon(t)).join("+")));
      btn.onclick=()=>{ S.aktiv=w.id; S.ansicht="wahlgang"; sichern(); zeichnen(); };
      rail.append(btn);
    }
  }

  /* ================= Bühne ================= */
  function statusSetzen(){
    const frei=S.mitglieder.filter(m=>m.frei).length, aus=S.mitglieder.length-frei;
    document.getElementById("status").innerHTML = S.mitglieder.length
      ? '<b>'+aus+'</b> Vertreter'
        + (frei? ' · <b>'+frei+'</b> frei ergänzt':'')
        + (S.faecher.length? ' · <b>'+S.faecher.length+'</b> Fachkonferenzen':'')
      : 'Vertreterliste noch nicht geladen';
  }
  function zeichnen(){
    railZeichnen();
    const f=document.getElementById("flaeche"); f.innerHTML="";
    statusSetzen();
    document.getElementById("btnEinrichtung").classList.toggle("stark", S.ansicht==="einrichtung");
    if(S.ansicht==="einrichtung") einrichtungZeichnen(f); else wahlgangZeichnen(f);
  }

  function einrichtungZeichnen(f){
    const k=el("div","kopfzeile"); const h=el("h2","titel","Einrichtung"); k.append(h); f.append(k);
    f.append(el("div","unterzeile","Kopfdaten des Protokolls und die Mitgliederliste, aus der die Kandidaten kommen."));
    const karten=el("div","karten");

    const k1=el("div","karte");
    k1.append(el("h3",null,"Kopf des Protokolls"));
    k1.append(el("p",null,"Steht auf Seite 1 der Vorlage."));
    for(const [key,lab] of [["schule","Schule"],["datum","Datum"],["wahlleitung","Wahlleitung"]]){
      const l=el("label","feld"); l.append(el("span",null,lab));
      const i=document.createElement("input"); i.id="feld_"+key; i.value=S.kopf[key]||"";
      i.oninput=()=>{ S.kopf[key]=i.value; sichern(); };
      l.append(i); k1.append(l);
    }
    karten.append(k1);

    const k2=el("div","karte");
    k2.append(el("h3",null,"Anwesende Wahlberechtigte"));
    k2.append(el("p",null,"Wird außerhalb dieses Werkzeugs festgestellt und hier nur eingetragen. Wer zwei Klassen vertritt, ist eine Person mit zwei Stimmen."));
    for(const [key,lab] of [["anwesendW","Wahlberechtigte"],["anwesendS","Stimmen — Grundlage für „einstimmig“"]]){
      const l=el("label","feld"); l.append(el("span",null,lab));
      const i=document.createElement("input"); i.id="feld_"+key; i.className="zahl"; i.inputMode="numeric"; i.value=S.kopf[key]||"";
      i.oninput=()=>{ S.kopf[key]=i.value; sichern(); };
      l.append(i); k2.append(l);
    }
    karten.append(k2);

    const k3=el("div","karte");
    k3.append(el("h3",null,"Mitgliederliste"));
    k3.append(el("p",null,"CSV-Auszug mit den Vertretern oder die vollständige Mitgliederliste. Spalten werden über ihre Überschriften gefunden, nicht über ihre Position."));
    const lab=el("label","datei");
    const inp=document.createElement("input"); inp.type="file"; inp.id="dateiwahl"; inp.accept=".csv,.xlsx,.xlsm";
    inp.onchange=e=>{ const d=e.target.files[0]; if(d) dateiLaden(d).catch(err=> meldung(k3, err.message)); };
    const b=el("span","knopf","Datei wählen"); lab.append(inp,b); k3.append(lab);
    const info=el("div","liste-info");
    if(S.mitglieder.length){
      const v=S.mitglieder.filter(m=>m.vertreter).length, st=S.mitglieder.filter(m=>m.stellv).length;
      info.innerHTML = (S.listeName?S.listeName+" · ":"")+"<b>"+v+"</b> Vertreter"
        + (st?", <b>"+st+"</b> Stellvertreter":"") + ", <b>"+S.faecher.length+"</b> Fachkonferenzen";
    } else { info.textContent="Ohne Liste lassen sich Kandidaten nur von Hand eintippen."; }
    if(S.nachversorgt) k3.append(el("div","liste-info",
      S.nachversorgt+" schon aufgestellte Kandidatur"+(S.nachversorgt===1?"":"en")+" hat die Adresse aus der neuen Liste bekommen."));
    k3.append(info);
    const lf=el("label","feld"); lf.append(el("span",null,"Fachkonferenzen, mit Komma getrennt"));
    const inf=document.createElement("input"); inf.id="feld_faecher"; inf.value=S.faecher.join(", ");
    inf.oninput=()=>{ S.faecher=inf.value.split(",").map(s=>s.trim()).filter(Boolean); sichern(); railZeichnen(); statusSetzen(); };
    lf.append(inf); k3.append(lf);
    karten.append(k3);

    const k4=el("div","karte");
    k4.append(el("h3",null,"Teilkonferenz"));
    k4.append(el("p",null,"Steht in der Kopfzeile von Seite 12: wofür die Teilkonferenz gebildet wird."));
    const l4=el("label","feld"); l4.append(el("span",null,"Teilkonferenz für"));
    const i4=document.createElement("input"); i4.id="feld_tk"; i4.value=S.kopf.teilkonferenz||"";
    i4.oninput=()=>{ S.kopf.teilkonferenz=i4.value; sichern(); railZeichnen(); };
    l4.append(i4); k4.append(l4);
    karten.append(k4);

    const k5=el("div","karte");
    k5.append(el("h3",null,"Zwischenstand"));
    k5.append(el("p",null,"Der Stand liegt im Browser dieses Rechners und übersteht ein Neuladen — auch das Öffnen am nächsten Tag. Gesichert wird oben in der Leiste."));
    const lz=el("label","datei");
    const iz=document.createElement("input"); iz.type="file"; iz.id="standwahl"; iz.accept=".json";
    iz.onchange=async e=>{
      const d=e.target.files[0]; if(!d) return;
      try{ const j=JSON.parse(await d.text()); if(j&&j.kopf){ Object.assign(S,j); sichern(); zeichnen(); } }
      catch(err){ meldung(k5,"Die Datei ließ sich nicht lesen."); }
    };
    lz.append(iz, el("span","knopf","Stand laden"));
    const zurueck=el("button","knopf","Alles zurücksetzen");
    zurueck.onclick=()=>{
      if(zurueck.dataset.sicher!=="ja"){
        zurueck.dataset.sicher="ja";
        zurueck.textContent="Wirklich? Alles zurücksetzen";
        zurueck.classList.add("warnknopf");
        setTimeout(()=>{ zurueck.dataset.sicher=""; zurueck.textContent="Alles zurücksetzen";
                         zurueck.classList.remove("warnknopf"); }, 5000);
        return;
      }
      try{ localStorage.removeItem(SCHLUESSEL); localStorage.removeItem(SCHLUESSEL_ALT); }catch(e){}
      S.kopf={schule:"", datum:heuteISO(), wahlleitung:"", anwesendW:"", anwesendS:"", teilkonferenz:""};
      S.mitglieder=[]; S.faecher=[]; S.wahlgaenge={}; S.aktiv="vorstand"; S.listeName=""; S.nachversorgt=0;
      zeichnen();
    };
    const zr=el("div","fussleiste"); zr.append(lz, zurueck); k5.append(zr);
    karten.append(k5);

    f.append(karten);
  }
  function meldung(wo,txt){ const m=el("div","hinweis",txt); wo.append(m); }

  function wahlgangZeichnen(f){
    const liste=wgListe();
    const seite = liste.find(x=>x.id===S.aktiv) || liste[0];
    S.aktiv=seite.id;

    const kz=el("div","kopfzeile");
    kz.append(el("div","eyebrow", seite.gruppe));
    f.append(kz);
    f.append(el("h2","titel", seite.titel));
    f.append(el("div","unterzeile",
      seite.teile.map(t=> t.label+" "+sitzeText(t)).join("  ·  ")));

    seite.teile.forEach((teil,ti)=> teilZeichnen(f, teil, ti));
  }

  function teilZeichnen(f, w, ti){
    const d=daten(w.id), sitze=sitzeVon(w);
    const block=el("section","block");
    const bk=el("div","blockkopf");
    bk.append(el("h3","blocktitel", w.label));
    bk.append(el("span","blocksitze", sitzeText(w)));
    block.append(bk);
    if(w.zusatz) meldung(block, w.hinweis || "Die amtliche Vorlage kennt für diesen Wahlgang keine Seite.");
    else if(w.hinweis) block.append(el("div","blockzeile", w.hinweis));

    const reihen=sortiert(w.id);
    const gezaehlt = reihen.some(k=>k.stimmen!=="" && k.stimmen!=null);
    const tab=el("div","tabelle");
    const kopf=el("div","treihe kopf");
    kopf.append(el("span",null,"#"), el("span",null,"Name"), el("span",null,"Stimmen"), el("span",null,""));
    tab.append(kopf);
    if(!reihen.length) tab.append(el("div","leerzeile","Noch niemand aufgestellt."));

    reihen.forEach((kand,i)=>{
      const gew = gezaehlt && i<sitze && (Number(kand.stimmen)||0)>0;
      const r=el("div","treihe"+(gew?" gewaehlt":""));
      r.append(el("div","rang", String(i+1)));
      const mitte=el("div");
      mitte.append(el("div","kname", kand.name));
      // Adressen bleiben vom Beamer fern; sie wandern nur ins Protokoll
      const unter=el("div","kmail");
      unter.textContent = [kand.klasse, kand.mail?"":"ohne E-Mail"].filter(Boolean).join(" · ");
      mitte.append(unter);
      if(gew) mitte.append(el("div","marke-gewaehlt","gewählt"));
      if(kand.nurStellv) mitte.append(el("div","marke-gewaehlt","Stellvertretung – laut Vorlage nicht wählbar"));
      r.append(mitte);
      const inp=document.createElement("input");
      inp.className="stimmen"; inp.inputMode="numeric"; inp.id="st_"+w.id+"_"+i;
      inp.value = kand.stimmen==null?"":kand.stimmen;
      inp.setAttribute("aria-label","Stimmen für "+kand.name);
      inp.oninput=()=>{ kand.stimmen = inp.value.replace(/[^0-9]/g,""); sichern(); };
      inp.onblur=()=> zeichnen();
      r.append(inp);
      const knoepfe=el("div","zeilknoepfe");
      // Einzeln abgestimmt, aber einstimmig: nur diese Kandidatur bekommt alle Stimmen
      const anzZ=String(S.kopf.anwesendS||"").trim();
      const e1=el("button","zk","✓");
      e1.disabled=!anzZ;
      e1.title=anzZ ? "Einstimmig gewählt: "+anzZ+" Stimmen" : "In der Einrichtung fehlt die Stimmenzahl der Anwesenden";
      e1.setAttribute("aria-label","Einstimmig gewählt: "+kand.name);
      e1.onclick=()=>{ kand.stimmen=anzZ; sichern(); zeichnen(); };
      const x=el("button","zk weg","×"); x.title="Streichen";
      x.setAttribute("aria-label","Kandidatur streichen: "+kand.name);
      x.onclick=()=>{ d.kandidaten = d.kandidaten.filter(k=>k!==kand); sichern(); zeichnen(); };
      knoepfe.append(e1,x);
      r.append(knoepfe);
      tab.append(r);
    });
    block.append(tab);

    if(gezaehlt && reihen.length>sitze){
      const grenze=Number(reihen[sitze-1]?.stimmen)||0;
      if(grenze>0 && (Number(reihen[sitze]?.stimmen)||0)===grenze)
        meldung(block,"Stimmengleichheit an der Sitzgrenze bei "+grenze+" Stimmen: nach § 117 Abs. 4 SchulG entscheidet eine Stichwahl, bei erneuter Gleichheit das Los der Wahlleitung. Geht es nur um den Rang in der Stellvertretung, sieht die Vorlage Verständigung und sonst das Los vor.");
    }

    // Kandidat aufnehmen
    const auf=el("div","aufnahme");
    const suche=document.createElement("input");
    suche.className="suchfeld"; suche.id="suche_"+w.id; suche.autocomplete="off";
    suche.placeholder = S.mitglieder.length
      ? w.label+": Name aufnehmen — tippen und mit Enter übernehmen"
      : w.label+": Name aufnehmen — Vertreterliste ist nicht geladen";
    auf.append(suche);
    const box=el("div","treffer"); box.hidden=true; auf.append(box);
    let aktiv=-1;
    function schliessen(){ box.hidden=true; box.innerHTML=""; aktiv=-1; }
    function aufnehmen(p){
      const name = p ? p.voll : suche.value.trim();
      if(!p && name && !S.mitglieder.some(m=>m.voll===name)){
        // Frei eingetippt: für diese Sitzung in den Bestand, damit die Suche ihn im
        // nächsten Wahlgang findet und die Schreibweise dieselbe bleibt. In die
        // geladene Liste wird nichts zurückgeschrieben.
        S.mitglieder.push({vorname:"", name:name, voll:name, klasse:"", mail:"",
                           vertreter:true, stellv:false, frei:true});
      }
      d.kandidaten.push({name:name, mail:p?p.mail:"", klasse:p?p.klasse:"",
                         stimmen:"", nurStellv: p? (!p.vertreter && p.stellv) : false});
      suche.value=""; schliessen(); sichern(); zeichnen();
      const n=document.getElementById("suche_"+w.id); if(n) n.focus();
    }
    function fuellen(){
      const q=suche.value.trim().toLowerCase();
      box.innerHTML="";
      if(!q){ schliessen(); return; }
      const drin=new Set(d.kandidaten.map(k=>k.name));
      const tr=S.mitglieder.filter(m=> !drin.has(m.voll)
        && (m.voll.toLowerCase().includes(q) || m.klasse.toLowerCase().includes(q))).slice(0,10);
      tr.forEach(p=>{
        const b=el("button"); b.type="button";
        b.append(el("span","tn",p.voll), el("span","tk",p.klasse||"—"));
        b.append(el("span","tr"+(p.vertreter&&!p.frei?"":" nein"),
                    p.frei ? "nicht aus der Liste" : (p.vertreter?"Vertreter":"nur Stellv.")));
        b.onmousedown=e=>{ e.preventDefault(); aufnehmen(p); };
        box.append(b);
      });
      box.hidden = tr.length===0; aktiv=-1;
    }
    suche.oninput=fuellen;
    suche.onkeydown=e=>{
      const btns=[...box.querySelectorAll("button")];
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){
        e.preventDefault();
        if(!btns.length) return;
        aktiv = (aktiv + (e.key==="ArrowDown"?1:-1) + btns.length) % btns.length;
        btns.forEach((b,i)=> b.classList.toggle("aktiv", i===aktiv));
      } else if(e.key==="Enter"){
        e.preventDefault();
        if(aktiv>=0 && btns[aktiv]) btns[aktiv].dispatchEvent(new MouseEvent("mousedown"));
        else if(suche.value.trim()) aufnehmen(null);
      } else if(e.key==="Escape"){ schliessen(); }
    };
    suche.onblur=()=> setTimeout(schliessen,120);
    block.append(auf);

    const fu=el("div","fussleiste");
    const l1=el("label"); l1.append(el("span",null,"Abgegebene Stimmen (bei geheimer Wahl)"));
    const i1=document.createElement("input"); i1.className="zahl"; i1.inputMode="numeric"; i1.id="abg_"+w.id;
    i1.value=d.abgegeben||""; i1.oninput=()=>{ d.abgegeben=i1.value.replace(/[^0-9]/g,""); sichern(); };
    l1.append(i1); fu.append(l1);
    const l2=el("label"); l2.append(el("span",null,"Sitze"));
    const i2=document.createElement("input"); i2.className="zahl"; i2.inputMode="numeric"; i2.id="sitze_"+w.id;
    i2.value = sitze===Infinity ? "" : String(sitze);
    i2.placeholder = "offen"; i2.oninput=()=>{ d.sitze=i2.value.replace(/[^0-9]/g,""); sichern(); };
    i2.onblur=()=>zeichnen();
    l2.append(i2); fu.append(l2);
    // Blockwahl: ein Wahlgang über alle. Vorgeschlagen ist die volle Stimmenzahl,
    // also Einstimmigkeit — für ein anderes Ergebnis die Zahl überschreiben.
    const anz=String(S.kopf.anwesendS||"").trim();
    const l3=el("label"); l3.append(el("span",null,"Blockwahl — alle auf"));
    const i3=document.createElement("input");
    i3.className="zahl"; i3.inputMode="numeric"; i3.id="block_"+w.id;
    i3.value = d.block!=null && d.block!=="" ? d.block : anz;
    i3.placeholder = anz || "—";
    i3.oninput=()=>{ d.block=i3.value.replace(/[^0-9]/g,""); i3.value=d.block; sichern(); };
    l3.append(i3);
    const be=el("button","knopf","übernehmen");
    be.disabled = !d.kandidaten.length;
    be.title = !d.kandidaten.length ? "Noch niemand aufgestellt"
             : "Jede Kandidatur bekommt die nebenstehende Stimmenzahl";
    be.onclick=()=>{
      const v=String(i3.value||"").trim();
      if(!v) return;
      d.kandidaten.forEach(k=> k.stimmen=v); sichern(); zeichnen();
    };
    l3.append(be);
    fu.append(l3);
    block.append(fu);

    f.append(block);
  }

  /* ================= Bedienung ================= */
  document.getElementById("btnEinrichtung").onclick=()=>{ S.ansicht = S.ansicht==="einrichtung"?"wahlgang":"einrichtung"; zeichnen(); };
  // Vollbild blendet den Rahmen der Artefakt-Ansicht aus. Verweigert der
  // Browser es, bleibt wenigstens die große Darstellung.
  async function beamer(an){
    document.body.classList.toggle("beamer", an);
    try{
      if(an){ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); }
      else if(document.fullscreenElement) await document.exitFullscreen();
    }catch(e){}
  }
  async function standSichern(){
    const b=document.getElementById("btnStand"), alt=b.textContent;
    const name="GEV-Wahlstand-"+(S.kopf.datum||"").replace(/\./g,"-")+".json";
    const blob=stand();
    try{
      if(downloads){ await downloads.save({filename:name, data:new Uint8Array(await blob.arrayBuffer())}); }
      else{
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob); a.download=name; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      }
      b.textContent="gesichert";
    }catch(e){ b.textContent="nicht gesichert"; }
    setTimeout(()=>{ b.textContent=alt; }, 1800);
  }
  document.getElementById("btnStand").onclick=standSichern;
  document.getElementById("btnBeamer").onclick=()=> beamer(!document.body.classList.contains("beamer"));
  document.addEventListener("fullscreenchange",()=>{
    if(!document.fullscreenElement && document.body.classList.contains("beamer")) beamer(false);
  });
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape" && document.body.classList.contains("beamer")) beamer(false);
  });

  wiederherstellen();
  zeichnen();
  verbinden();
})();
</script>
