<title>GEV-Wahlhelfer</title>
<!-- Papa Parse 5.4.1, MIT, liegt im Ordner. Nur falls das nicht geladen werden darf
     — etwa unter einer strengen Sicherheitsregel — kommt es von cdnjs. -->
<script src="papaparse.min.js"></script>
<script>
  if (typeof Papa === "undefined")

<style>
  :root{
    --ground:#FBFBFC; --panel:#FFFFFF; --ink:#16181D; --muted:#5C6270; --faint:#8A90A0;
    --line:#DFE1E7; --line-soft:#ECEEF2; --accent:#1F4FA3; --accent-soft:#E7EDF8;
    --elected:#1E6E4B; --elected-soft:#E3F1EA; --warn:#9A6B12; --warn-soft:#FAF0DC;
    --shadow:0 1px 2px rgba(22,24,29,.06), 0 8px 24px rgba(22,24,29,.05);
    /* Was auf dem Rechner liegt. Nichts wird nachgeladen, nichts mitgeliefert;
       den Unterschied zwischen Ueberschrift und Text macht die Staerke. */
    --display:system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --body:system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono:ui-monospace, "DejaVu Sans Mono", "SF Mono", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#14161A; --panel:#1B1E24; --ink:#EEF0F4; --muted:#A2A9B8; --faint:#79808F;
      --line:#2A2E36; --line-soft:#23272E; --accent:#7FA8EE; --accent-soft:#1E2938;
      --elected:#5FBF92; --elected-soft:#17291F; --warn:#D9A648; --warn-soft:#2B2417;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#14161A; --panel:#1B1E24; --ink:#EEF0F4; --muted:#A2A9B8; --faint:#79808F;
    --line:#2A2E36; --line-soft:#23272E; --accent:#7FA8EE; --accent-soft:#1E2938;
    --elected:#5FBF92; --elected-soft:#17291F; --warn:#D9A648; --warn-soft:#2B2417;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0;}
  button{font:inherit; color:inherit; cursor:pointer;}
  input,select{font:inherit; color:inherit;}
  .wrap{display:grid; grid-template-columns:288px minmax(0,1fr); min-height:100%;}

  /* ---- Schiene ---- */
  .rail{border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:100%;}
  .rail-kopf{padding:16px; border-bottom:1px solid var(--line);}
  .marke{font-family:var(--display); font-weight:800; font-size:16px; letter-spacing:-.01em;}
  .rail-liste{flex:1; overflow-y:auto; padding:8px 8px 20px;}
  .wg{display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:0;
    border-radius:7px; padding:8px 9px; color:var(--ink); line-height:1.25;}
  .wg:hover{background:var(--line-soft);}
  .wg[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .wg .punkt{width:8px; height:8px; border-radius:50%; flex:none; border:1.5px solid var(--faint);}
  .wg.offen .punkt{border-color:var(--faint);}
  .wg.laeuft .punkt{border-color:var(--warn); background:var(--warn);}
  .wg.fertig .punkt{border-color:var(--elected); background:var(--elected);}
  .wg .txt{flex:1; min-width:0; font-size:13.5px;}
  .wg .sitze{font-family:var(--mono); font-size:11px; color:var(--faint);}
  .railkopf{padding:12px 9px 4px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--faint); font-weight:600;}

  /* ---- Bühne ---- */
  .buehne{display:flex; flex-direction:column; min-width:0;}
  .leiste{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; display:flex; flex-wrap:wrap;
    align-items:center; gap:8px; padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--line);}
  .leiste .lücke{flex:1}
  .knopf{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 13px; font-size:13.5px; font-weight:500;}
  .knopf:hover{border-color:var(--accent); color:var(--accent);}
  .knopf.stark{background:var(--accent); border-color:var(--accent); color:#fff;}
  .knopf.stark:hover{filter:brightness(1.08); color:#fff;}
  .knopf:disabled{opacity:.45; cursor:not-allowed;}
  .knopf.warnknopf{border-color:var(--warn); color:var(--warn); font-weight:600;}

  .flaeche{flex:1; padding:26px 20px 60px; max-width:1100px; width:100%; margin:0 auto;}

  .kopfzeile{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:4px;}
  .eyebrow{font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); font-weight:600;}
  h2.titel{font-size:clamp(26px,3.6vw,40px); font-weight:800; letter-spacing:-.02em; line-height:1.12;}
  .unterzeile{color:var(--muted); font-size:14.5px; margin-top:6px;}

  .hinweis{margin-top:14px; border-left:3px solid var(--warn); background:var(--warn-soft); color:var(--warn);
    padding:9px 13px; border-radius:0 7px 7px 0; font-size:13px;}

  /* ---- Block je Wahlgang ---- */
  .block{margin-top:30px; padding-top:22px; border-top:1px solid var(--line);}
  .block:first-of-type{border-top:0; padding-top:0; margin-top:22px;}
  .blockkopf{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .blocktitel{font-size:19px; font-weight:600; letter-spacing:-.01em;}
  .blocksitze{font-family:var(--mono); font-size:12px; color:var(--faint);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px;}
  .blockzeile{color:var(--muted); font-size:13.5px; margin-top:3px;}

  /* ---- Kandidatentabelle ---- */
  .tabelle{margin-top:14px; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--panel); box-shadow:var(--shadow);}
  .treihe{display:grid; grid-template-columns:34px minmax(0,1fr) 128px 70px; align-items:center; gap:12px;
    padding:13px 16px; border-top:1px solid var(--line-soft);}
  .zeilknoepfe{display:flex; gap:2px; justify-content:flex-end;}
  .zk{border:0; background:none; color:var(--faint); font-size:16px; line-height:1; padding:5px 6px; border-radius:6px;}
  .zk:hover:not(:disabled){background:var(--line-soft); color:var(--elected);}
  .zk.weg:hover{color:var(--warn);}
  .zk:disabled{opacity:.3; cursor:not-allowed;}
  .treihe:first-child{border-top:0;}
  .treihe.kopf{background:var(--line-soft); padding-block:9px; border-top:0;}
  .treihe.kopf span{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:600;}
  .rang{font-family:var(--mono); font-size:15px; color:var(--faint); text-align:right;}
  .kname{font-size:17px; font-weight:500; overflow-wrap:anywhere;}
  .kmail{font-size:12.5px; color:var(--faint); overflow-wrap:anywhere;}
  .stimmen{width:100%; font-family:var(--mono); font-size:19px; font-weight:600; text-align:right;
    border:1px solid var(--line); border-radius:7px; padding:6px 10px; background:var(--ground);}
  .stimmen:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .treihe.gewaehlt{background:var(--elected-soft);}
  .treihe.gewaehlt .rang{color:var(--elected); font-weight:600;}
  .marke-gewaehlt{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--elected); font-weight:600;}
  .annahme{display:inline-block; margin-top:2px; border:1px solid currentColor; border-radius:999px;
    padding:1px 9px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
    background:none;}
  .annahme.offen{color:var(--warn);}
  .annahme.ja{color:var(--elected);}
  .annahme.nein{color:var(--warn); text-decoration:line-through;}
  .leerzeile{padding:26px 16px; color:var(--faint); font-size:14px; text-align:center;}

  /* ---- Kandidat aufnehmen ---- */
  .aufnahme{margin-top:16px; position:relative;}
  .suchfeld{width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 14px; font-size:15px; background:var(--panel);}
  .suchfeld:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .treffer{position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:9; background:var(--panel);
    border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); max-height:320px; overflow-y:auto;}
  .treffer button{display:flex; width:100%; align-items:baseline; gap:10px; text-align:left; background:none;
    border:0; border-top:1px solid var(--line-soft); padding:9px 14px;}
  .treffer button:first-child{border-top:0;}
  .treffer button:hover,.treffer button.aktiv{background:var(--accent-soft);}
  .treffer .tn{font-weight:500;}
  .treffer .tk{font-family:var(--mono); font-size:11.5px; color:var(--faint);}
  .treffer .tr{margin-left:auto; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint);}
  .treffer .tr.nein{color:var(--warn);}

  /* ---- Stimmen ---- */
  .fussleiste{margin-top:18px; display:flex; flex-wrap:wrap; gap:16px 26px; align-items:center;
    font-size:13.5px; color:var(--muted);}
  .fussleiste label{display:flex; align-items:center; gap:9px;}
  .fussleiste input.breit{width:200px; font-family:var(--body); text-align:left;}
  .fussleiste label.breitzeile{flex-basis:100%;}
  .fussleiste input.breiter{flex:1; min-width:0; width:auto; font-family:var(--body); text-align:left;}
  .fussleiste input{width:88px; font-family:var(--mono); text-align:right; border:1px solid var(--line);
    border-radius:7px; padding:6px 9px; background:var(--panel);}
  /* ---- Wahlleitung je Wahlgang ---- */
  .wl{display:flex; flex-wrap:wrap; gap:6px; align-items:center; flex:1; min-width:0;}
  .wlk{border:1px solid var(--line); background:var(--panel); border-radius:999px;
    padding:5px 12px; font-size:13px; line-height:1.2;}
  .wlk:hover{border-color:var(--accent); color:var(--accent);}
  .wlk.an{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .fussleiste input.wlfeld{width:170px; font-family:var(--body); text-align:left;}

  /* ---- Einrichtung ---- */
  .karten{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); margin-top:20px;}
  .karte{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:16px; box-shadow:var(--shadow);}
  .karte h3{font-size:14px; font-weight:600; letter-spacing:-.01em;}
  .karte p{color:var(--muted); font-size:13px; margin:6px 0 12px;}
  .feld{display:block; margin-top:10px;}
  .feld span{display:block; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:4px;}
  .feld input, .feld select{width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 11px; background:var(--ground); font:inherit;}
  .datei{display:inline-flex; align-items:center; gap:8px;}
  /* Die Knöpfe zum Laden und Zurücksetzen stehen untereinander und gleich breit */
  .knopfspalte{flex-direction:column; align-items:stretch; gap:8px;}
  .knopfspalte > *{width:100%;}
  .knopfspalte .knopf{width:100%; text-align:center;}
  .datei input{display:none;}
  .zahl{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .liste-info{font-size:13px; color:var(--muted); margin-top:10px;}
  .lizenz{margin-top:26px; font-size:12px; color:var(--faint);}
  .lizenz a{color:inherit;}
  .liste-info b{color:var(--ink); font-family:var(--mono);}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  /* Kurze Rueckmeldung, damit das Sichern sichtbar ist, ohne den Blick zu verschieben */
  .toast{position:fixed; right:18px; bottom:18px; z-index:50; background:var(--panel);
    border:1px solid var(--line); border-radius:9px; padding:9px 14px; box-shadow:var(--shadow);
    font-size:13.5px; font-weight:500;}
  /* ---- Protokoll: Bildschirm wie Papier, Druck als A4 ---- */
  .prot{max-width:186mm; margin:0 auto; color:#16181D;}
  .prot .blatt{background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:16mm 14mm; margin-bottom:14px; box-shadow:var(--shadow);}
  .prot h1{font-size:19px; margin-bottom:2px;}
  .prot .pjahr{font-size:12.5px; color:#5C6270; margin-bottom:8px;}
  .prot h2{font-size:16px; margin:0 0 2px;}
  .prot .psatz + h2{margin-top:16px;}
  .prot h3{font-size:14px; font-weight:700; margin:16px 0 4px; font-family:var(--body);}
  .prot h4{font-size:12.5px; font-weight:600; margin:9px 0 3px; font-family:var(--body); color:#5C6270;}
  .prot .pzeile{display:flex; gap:10px; font-size:13px; padding:3px 0; border-bottom:1px solid #DFE1E7;}
  .prot .pzeile b{font-weight:600; min-width:46mm; flex:none;}
  .prot .abschnitt > .pzeile:first-child{margin-top:16px;}
  .prot .psatz{font-size:13px; margin:10px 0 0;}
  .prot .pmeta{font-size:12.5px; margin:6px 0 0; color:#5C6270;}
  .prot .pklein{font-size:11px; color:#5C6270; font-weight:400;}
  .prot .pmeta b{color:#16181D; font-weight:600;}
  .prot table{width:100%; border-collapse:collapse; font-size:13px; margin-top:3px;}
  .prot thead{display:table-header-group;}
  .prot h3, .prot h4{break-after:avoid; page-break-after:avoid;}
  .prot td.f{width:26mm;}
  .prot th, .prot td{border:1px solid #9AA0AC; padding:3px 6px; text-align:left; vertical-align:top;}
  .prot th{background:#EDEFF3; font-weight:600; font-size:12px;}
  .prot td.z{font-family:var(--mono); text-align:right; width:24mm;}
  .prot td.r{font-family:var(--mono); text-align:center; width:10mm;}
  .prot td.leer{color:#8A90A0;}
  .prot .erg th{background:#5C6270; color:#fff; border-color:#5C6270;}
  .prot .unters{display:flex; gap:14mm; margin-top:16mm;}
  .prot .unters div{flex:1; border-top:1px solid #16181D; padding-top:3px; font-size:12px;}
  .prot .fuss{font-size:11px; color:#5C6270; margin-top:10mm;}
  /* Die Seitenzahl setzt der Druck, nur er weiss, wo umgebrochen wird. Den Randkasten
     kennt bisher nur Chromium; andere Browser lassen die Zeile weg. */
  @page{ size:A4 portrait; margin:16mm 14mm;
    @bottom-center{ content:"Seite " counter(page) " von " counter(pages);
      font-family:system-ui, Arial, sans-serif; font-size:9pt; color:#5C6270; } }
  @media print{
    html,body{height:auto; background:#fff;}
    .rail, .leiste, .nodruck{display:none !important;}
    .wrap{display:block;}
    .buehne{display:block;}
    .flaeche{padding:0; overflow:visible;}
    .prot{max-width:none;}
    .prot .blatt{border:0; border-radius:0; padding:0; margin:0; box-shadow:none;
      break-after:page; page-break-after:always;}
    .prot .blatt:last-child{break-after:auto; page-break-after:auto;}
    .prot tr, .prot .abschnitt{break-inside:avoid; page-break-inside:avoid;}
  }
  /* Vollbild, also F11: dieselbe Ansicht, nur groesser — die Schiene bleibt stehen,
     damit alle im Raum sehen, wo der Ablauf steht. Gesetzt wird die Klasse unten. */
  body.gross .flaeche{max-width:1500px; padding-top:34px;}
  body.gross h2.titel{font-size:clamp(34px,4.6vw,58px);}
  body.gross .unterzeile{font-size:18px;}
  body.gross .blocktitel{font-size:27px;}
  body.gross .blockzeile{font-size:16px;}
  body.gross .kname{font-size:24px;}
  body.gross .kmail{font-size:14px;}
  body.gross .treihe{padding:17px 20px;}
  body.gross .rang{font-size:20px;}
  body.gross .stimmen{font-size:26px;}
  body.gross .annahme{font-size:14px; padding:2px 12px;}
  body.gross .toast{font-size:17px; padding:12px 20px;}
  body.gross .wg .txt{font-size:15px;}
  body.gross .wg .sitze{font-size:12px;}
  @media (max-width:820px){
    .wrap{grid-template-columns:minmax(0,1fr);}
    .rail{border-right:0; border-bottom:1px solid var(--line); min-height:0;}
    .rail-liste{max-height:230px;}
    .treihe{grid-template-columns:28px minmax(0,1fr) 92px 62px; gap:8px; padding:11px 12px;}
    /* Ja, Nein und Enthaltung passen auf dem schmalen Schirm nicht neben den Namen:
       der Name bekommt die erste Zeile, die drei Zahlen die zweite. */
    .treihe.jeperson{grid-template-columns:28px repeat(3,minmax(0,1fr)) 62px !important;
      grid-template-areas:"name name name name name" "rang ja nein enth knoepfe"; row-gap:9px;}
    .treihe.jeperson > .rang{grid-area:rang;}
    .treihe.jeperson > .kzelle{grid-area:name;}
    .treihe.jeperson > .zeilknoepfe{grid-area:knoepfe;}
    .treihe.jeperson > input.stimmen:nth-of-type(1){grid-area:ja;}
    .treihe.jeperson > input.stimmen:nth-of-type(2){grid-area:nein;}
    .treihe.jeperson > input.stimmen:nth-of-type(3){grid-area:enth;}
    .treihe.kopf.jeperson > span:nth-of-type(1){grid-area:rang;}
    .treihe.kopf.jeperson > span:nth-of-type(2){grid-area:name;}
    .treihe.kopf.jeperson > span:nth-of-type(3){grid-area:ja;}
    .treihe.kopf.jeperson > span:nth-of-type(4){grid-area:nein;}
    .treihe.kopf.jeperson > span:nth-of-type(5){grid-area:enth;}
    .treihe.kopf.jeperson > span:nth-of-type(n+6){display:none;}
    .flaeche{padding:20px 16px 50px;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>

<div class="wrap">
  <aside class="rail">
    <div class="rail-kopf">
      <div class="marke" id="marke"></div>
    </div>
    <div class="rail-liste" id="rail"></div>
  </aside>

  <main class="buehne">
    <div class="leiste">
      <span class="lücke"></span>
      <button class="knopf stark" id="btnStand" title="Strg+S">Stand sichern</button>
    </div>
    <div class="flaeche" id="flaeche"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ================= Wahlgänge ================= */
  // Ein Bild je Gremium, darin Hauptamt und Stellvertretung als eigene Wahlgänge.
  const GREMIEN = [
    {gruppe:"Gesamtelternvertretung", id:"vorstand", titel:"Elternsprecher:in der Schule", teile:[
      {id:"vorsitz",        label:"Elternsprecher:in", sitze:1, hinweis:"zugleich Vorsitz der GEV"},
      {id:"stellv_vorsitz", label:"Stellvertretung",   sitze:3, hinweis:"mindestens eine, höchstens drei Personen"}]},
    {gruppe:"GEV-Vorstand", id:"vorstand_weitere", titel:"Weitere Mitglieder im Vorstand", teile:[
      {id:"vorstand_weitere", label:"Weitere Mitglieder", sitze:null,
       hinweis:"Die Anzahl beschließt die Versammlung."}]},
    {gruppe:"Schulkonferenz", id:"skseite", titel:"Schulkonferenz", teile:[
      {id:"sk",        label:"Mitglieder",      sitze:4, hinweis:"zwei Schuljahre"},
      {id:"sk_stellv", label:"Stellvertretung", sitze:8, hinweis:"Reihenfolge nach Stimmenzahl"}]},
    {gruppe:"Bezirkselternausschuss", id:"beaseite", titel:"Bezirkselternausschuss", teile:[
      {id:"bea",        label:"Mitglieder",      sitze:2, hinweis:"zwei Schuljahre"},
      {id:"bea_stellv", label:"Stellvertretung", sitze:4, hinweis:"Reihenfolge nach Stimmenzahl"}]},
    {gruppe:"Gesamtkonferenz", id:"gkseite", titel:"Gesamtkonferenz", teile:[
      {id:"gk",        label:"Beratende Mitglieder", sitze:2, hinweis:"ein Schuljahr"},
      {id:"gk_stellv", label:"Stellvertretung",      sitze:4}]},
    {gruppe:"Gesamtschülervertretung", id:"gsvseite", titel:"Gesamtschülervertretung", teile:[
      {id:"gsv",        label:"Beratende Mitglieder", sitze:2},
      {id:"gsv_stellv", label:"Stellvertretung",      sitze:4}]}
  ];
  const TEILKONFERENZ = {gruppe:"Teilkonferenz", id:"tkseite", titel:"Teilkonferenz", teile:[
      {id:"tk",        label:"Mitglied",        sitze:1},
      {id:"tk_stellv", label:"Stellvertretung", sitze:2}]};

  // Ohne gesicherten Stand beginnt das Werkzeug in der Einrichtung; wer schon
  // gearbeitet hat, landet wieder dort, wo er aufgehoert hat. Derselbe Leerstand
  // dient beim Laden und beim Zuruecksetzen: eine Datei, die einen Schluessel nicht
  // kennt, soll ihn loeschen und nicht den alten Inhalt stehen lassen.
  function leerstand(){
    return {
      kopf:{schule:"", datum:heuteISO(), wahlleitung:"", wahlhelfer:"", anwesendW:"", anwesendS:"",
            quorum:"erfüllt", teilkonferenz:""},
      mitglieder:[], fachbloecke:[], leitungen:[], wahlgaenge:{},
      aktiv:"vorstand", ansicht:"einrichtung", listeName:"", nachversorgt:0, unklar:[]
    };
  }
  const S = leerstand();
  // Namen kommen ausschliesslich aus der geladenen Datei und bleiben im Browser
  // dieses Rechners. Die Seite selbst speichert nichts ausserhalb.
  const SCHLUESSEL = "gev-wahlhelfer";
  const SCHLUESSEL_ALT = "gev-wahlgang";   // früherer Name, wird noch gelesen
  let downloads=null, speicherTimer=null, treffAktiv=-1;

  function heuteISO(){ const d=new Date(); return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); }
  function el(t,k,x){ const n=document.createElement(t); if(k) n.className=k; if(x!=null) n.textContent=x; return n; }
  // „Block 1: Ma, Ph; Block 2: De, En/Frz" — Komma trennt die Faecher, Semikolon die
  // Bloecke, der Name vor dem Doppelpunkt ist die Ueberschrift. Fehlt er, wird gezaehlt.
  // Wozu die Schule die Bloecke bildet, ist ihre Sache; das Werkzeug zeigt sie an und
  // meldet, wer in zweien desselben Blocks steht.
  function fachblockLesen(txt){
    const raus=[];
    String(txt||"").split(";").forEach(teil=>{
      const t=teil.trim(); if(!t) return;
      const m=/^([^:,]{1,40}):([\s\S]*)$/.exec(t);
      const faecher=(m ? m[2] : t).split(",").map(x=>x.trim()).filter(Boolean);
      if(faecher.length) raus.push({titel: m ? m[1].trim() : "", faecher});
    });
    return raus;
  }
  function fachblockTitel(s, i){ return s.titel || ("Block "+(i+1)); }
  // Die Faecher stehen nur in den Bloecken; die flache Liste wird daraus gebildet,
  // damit beide nicht auseinanderlaufen koennen. Eine schlichte Kommaliste ist ein
  // einzelner Block ohne Titel — der zeigt keine Ueberschrift und bildet keine Nachbarn.
  function faecherListe(){
    return (S.fachbloecke||[]).reduce((a,x)=> a.concat(x.faecher), []);
  }
  function bloeckeSichtbar(){
    const s=S.fachbloecke||[];
    return s.length>1 || (s.length===1 && !!s[0].titel);
  }
  // Eine neu geladene Liste bringt ihre Faecher mit: bekannte behalten ihren Block,
  // unbekannte haengen hinten ohne an. Die Reihenfolge folgt danach den Bloecken.
  function fachbloeckeAngleichen(neu){
    const da=new Set(neu), drin=[];
    const bloecke=(S.fachbloecke||[])
      .map(x=> ({titel:x.titel, faecher:x.faecher.filter(f=> da.has(f))}))
      .filter(x=> x.faecher.length);
    bloecke.forEach(x=> x.faecher.forEach(f=> drin.push(f)));
    const rest=neu.filter(f=> !drin.includes(f));
    if(rest.length) bloecke.push({titel:"", faecher:rest});
    S.fachbloecke=bloecke;
  }
  function fachblockText(){
    const s=S.fachbloecke||[];
    return bloeckeSichtbar()
      ? s.map(x=> (x.titel ? x.titel+": " : "") + x.faecher.join(", ")).join("; ")
      : faecherListe().join(", ");
  }
  function fachblockVon(fach){
    const s=S.fachbloecke||[];
    if(!bloeckeSichtbar()) return "";
    for(let i=0;i<s.length;i++) if(s[i].faecher.includes(fach)) return fachblockTitel(s[i], i);
    return "";
  }
  // Faecher desselben Blocks, das eigene ausgenommen
  function fachblockNachbarn(fach){
    if(!bloeckeSichtbar()) return [];
    for(const x of (S.fachbloecke||[])) if(x.faecher.includes(fach)) return x.faecher.filter(f=>f!==fach);
    return [];
  }
  function wgListe(){
    const fk=[];
    for(const f of faecherListe()){
      fk.push({gruppe:"Fachkonferenzen", fachblock:fachblockVon(f),
               id:"fkseite::"+f, titel:"Fachkonferenz "+f, teile:[
        {id:"fk::"+f,  label:"Beratende Mitglieder", sitze:2},
        {id:"fks::"+f, label:"Stellvertretung",      sitze:4}]});
    }
    const tk = String(S.kopf.teilkonferenz||"").trim() ? [TEILKONFERENZ] : [];
    return GREMIEN.concat(fk, tk);
  }
  function alleTeile(){ return wgListe().reduce((a,s)=>a.concat(s.teile),[]); }
  function teilVon(id){ return alleTeile().find(t=>t.id===id); }
  function daten(id){ if(!S.wahlgaenge[id]) S.wahlgaenge[id]={kandidaten:[], abgegeben:"", sitze:null, art:"offen", blockwahl:true, enth:"", ung:"", nein:"", leitung:"", bemerkung:"", stichwahl:false, reihenfolge:""}; return S.wahlgaenge[id]; }
  // sitze:null heißt offen — die Zahl wird erst in der Versammlung beschlossen
  function sitzeVon(t){
    const d=daten(t.id);
    if(d.sitze!=null && d.sitze!=="") return Number(d.sitze);
    return t.sitze==null ? Infinity : t.sitze;
  }
  function sitzeText(t){ const n=sitzeVon(t); return n===Infinity ? "offen" : n+(n===1?" Sitz":" Sitze"); }
  function sitzeFuer(id){ const t=teilVon(id); return t ? sitzeVon(t) : 1; }
  const zahl=x=> Number(x)||0;
  // Ist die Kandidatur gezaehlt, heisst ein leeres Nein- oder Enthaltungsfeld null.
  // Solange nicht gezaehlt ist, bleibt es leer und die Niederschrift zeigt einen Strich.
  const nullzahl=(k,v)=> String(v==null?"":v).trim()!=="" ? v
                       : (String(k.stimmen==null?"":k.stimmen).trim()!=="" ? "0" : "");
  // Wurde nach Nein und Enthaltung gar nicht gefragt, bleiben beide Spalten leer —
  // dann gehoeren sie nicht in die Niederschrift, und „0" waere eine Behauptung.
  function dreiGezaehlt(id){
    return daten(id).kandidaten.some(k=>
      String(k.nein==null?"":k.nein).trim()!=="" || String(k.enth==null?"":k.enth).trim()!=="");
  }
  // Wie gezaehlt wird, folgt aus Wahlart, Abstimmungsweise und dem Verhaeltnis der
  // Kandidaturen zu den Sitzen:
  //   "block"   ein Satz Zahlen fuer den ganzen Wahlgang. Bei Blockwahl wird ueber alle
  //             zusammen abgestimmt, verschiedene Zahlen kann es dabei nicht geben.
  //   "person"  Ja, Nein und Enthaltung je Kandidatur. Die Enthaltung zu einer einzelnen
  //             Person ist weder Nein noch Enthaltung zum Wahlgang — SchulGWahlO § 5
  //             Absatz 2 Satz 3 verlangt die drei Angaben hinter jedem Namen.
  //   "stimmen" eine Stimmenzahl je Kandidatur; Enthaltung und ungueltige gelten dem
  //             ganzen Wahlgang, so sieht der Stimmzettel einer Auswahlwahl aus.
  function erfassungD(d, sitze){
    if(!(d.kandidaten||[]).length) return "stimmen";
    const auswahl = sitze!==Infinity && d.kandidaten.length>sitze;
    if(!auswahl) return d.blockwahl ? "block" : "person";
    // Geheime Auswahlwahl: auf dem Zettel stehen Namen, Enthaltung und ungueltige
    // gelten dem ganzen Wahlgang — SchulGWahlO § 5 Absatz 2.
    if((d.art||"offen")==="geheim") return "stimmen";
    // Offene Auswahlwahl: es wird Kandidatur fuer Kandidatur gefragt, nur nicht immer
    // nach Nein und Enthaltung. Ob sie gezaehlt wurden, steht in den Zahlen selbst.
    return "person";
  }
  function erfassungVon(id){ return erfassungD(daten(id), sitzeFuer(id)); }
  // Ja, Nein und Enthaltung stehen bei beiden in der Tabelle — im Block ueberall gleich
  const dreiZahlen = a => a==="person" || a==="block";
  // Frueher standen Nein und Enthaltung als Gesamtzahl am Wahlgang; wo ueber jede Person
  // einzeln abgestimmt wurde, galten sie fuer jede Person gleichermassen. Ein alter Stand
  // wird beim Laden darauf umgeschrieben.
  function umstellen(){
    // Aeltere Staende kennen nur die flache Faecherliste, neuere die Bloecke. Geladen
    // wird, was da ist; die flache Liste verschwindet danach aus dem Zustand.
    if(!(S.fachbloecke||[]).length && Array.isArray(S.faecher) && S.faecher.length)
      S.fachbloecke=[{titel:"", faecher:S.faecher.slice()}];
    delete S.faecher;
    for(const id in S.wahlgaenge){
      const d=S.wahlgaenge[id];
      if(!d || !dreiZahlen(erfassungD(d, sitzeFuer(id)))) continue;
      const gn=String(d.nein||"").trim(), ge=String(d.enth||"").trim();
      if(!gn && !ge) continue;
      if(d.kandidaten.some(k=> String(k.nein||"").trim() || String(k.enth||"").trim())) continue;
      d.kandidaten.forEach(k=>{ if(gn) k.nein=gn; if(ge) k.enth=ge; });
      d.nein=""; d.enth="";
    }
  }
  function sortiert(id){
    return daten(id).kandidaten.slice().sort((a,b)=>
      ((Number(b.stimmen)||0)-(Number(a.stimmen)||0))
      || ((Number(b.stimmen2)||0)-(Number(a.stimmen2)||0)));
  }
  // Gleiche Stimmenzahl unter den Gewaehlten: dann entscheidet die Verordnung nicht,
  // sondern Einvernehmen oder Los — die Reihenfolge wird von Hand gesetzt.
  function istStellv(id){ const t=teilVon(id); return !!t && t.label.indexOf("Stellv")===0; }
  function gleichstand(id){
    if(!istStellv(id)) return false;
    const k=sortiert(id).filter(x=>(Number(x.stimmen)||0)>0);
    for(let i=1;i<k.length;i++)
      if((Number(k[i].stimmen)||0)===(Number(k[i-1].stimmen)||0)
         && (Number(k[i].stimmen2)||0)===(Number(k[i-1].stimmen2)||0)) return true;
    return false;
  }
  function statusTeil(t){
    const d=daten(t.id);
    if(!d.kandidaten.length) return "offen";
    if(!d.kandidaten.some(k=>k.stimmen!=="" && k.stimmen!=null)) return "laeuft";
    const g=gewaehlt(t.id);
    return g.length && g.every(k=>k.annahme==="ja") ? "fertig" : "laeuft";
  }
  function statusVon(seite){
    const st=seite.teile.map(statusTeil);
    if(st.every(x=>x==="fertig")) return "fertig";
    if(st.every(x=>x==="offen"))  return "offen";
    return "laeuft";
  }

  /* ================= Mitgliederliste ================= */
  function spalteSuchen(zeilen, texte, zeilenIdx){
    for(const r of zeilenIdx){
      const z = zeilen[r]||[];
      for(let c=0;c<z.length;c++){
        const v=String(z[c]==null?"":z[c]).replace(/\s+/g," ").trim().toLowerCase();
        if(texte.some(t=> v===t.toLowerCase())) return c;
      }
    }
    return -1;
  }
  // Auszug: eine Zeile je Vertreter. Pflicht ist nur »Name«; »Klasse«
  // (früher »Herkunftsgremium«), »Vorname« und »E-Mail« ergänzen, wenn vorhanden. Eine Spalte »Typ« mit dem
  // Wert »Fachkonferenz« nimmt die Fächer mit auf, muss es aber nicht.
  function auszugLesen(zeilen){
    const kopf=(zeilen[0]||[]).map(v=>String(v==null?"":v).trim().toLowerCase());
    const sp=n=>kopf.indexOf(n);
    const cNam=sp("name");
    if(cNam<0 || sp("gev-mitglied")>=0) return null;   // leer oder volle Mitgliederliste
    const cTyp=sp("typ"), cVor=sp("vorname"), cMail=sp("e-mail");
    const cGrem=sp("klasse")>=0 ? sp("klasse") : sp("herkunftsgremium");
    const leute=[], faecher=[];
    for(let r=1;r<zeilen.length;r++){
      const z=zeilen[r]||[];
      const nam=String(z[cNam]==null?"":z[cNam]).trim();
      if(!nam) continue;
      const typ=cTyp>=0 ? String(z[cTyp]==null?"":z[cTyp]).trim().toLowerCase() : "";
      if(typ.startsWith("fachkonferenz")){ if(!faecher.includes(nam)) faecher.push(nam); continue; }
      const vor=String((cVor>=0?z[cVor]:"")||"").trim();
      const kl=String((cGrem>=0?z[cGrem]:"")||"").trim();
      const ma=String((cMail>=0?z[cMail]:"")||"").trim();
      leute.push({vorname:vor, name:nam, voll:(vor?vor+" ":"")+nam, klasse:kl, mail:ma,
                  id:(vor?vor+" ":"")+nam+"|"+kl+"|"+ma, vertreter:true, stellv:false});
    }
    return leute.length ? {leute: zusammenlegen(leute), faecher} : null;
  }

  // Dieselbe Person in zwei Klassen wird oft in zwei Zeilen erfasst. Gleicher Name
  // und gleiche Adresse heißt: eine Person, zwei Mandate — die Klassen wandern
  // zusammen in eine Zeile. Ohne Adresse bleibt es bei getrennten Einträgen, denn
  // dann sind Namensvettern nicht davon zu unterscheiden.
  function zusammenlegen(leute){
    const raus=[], nach={};
    for(const l of leute){
      const schluessel = l.mail ? l.voll+"|"+l.mail.toLowerCase() : null;
      const vorhanden = schluessel ? nach[schluessel] : null;
      if(!vorhanden){
        if(schluessel) nach[schluessel]=l;
        raus.push(l); continue;
      }
      const klassen = vorhanden.klasse.split(",").map(x=>x.trim()).filter(Boolean);
      if(l.klasse && !klassen.includes(l.klasse)) klassen.push(l.klasse);
      vorhanden.klasse = klassen.join(", ");
      vorhanden.id = vorhanden.voll+"|"+vorhanden.klasse+"|"+vorhanden.mail;
      vorhanden.vertreter = vorhanden.vertreter || l.vertreter;
      vorhanden.stellv = vorhanden.stellv || l.stellv;
    }
    return raus;
  }
  function listeLesen(zeilen){
    const idx=[0,1,2,3,4,5,6];
    const cGrem=spalteSuchen(zeilen,["Klasse","Herkunftsgremium"],idx);
    const cVor =spalteSuchen(zeilen,["Vorname"],idx);
    const cNam =spalteSuchen(zeilen,["Name"],idx);
    const cMail=spalteSuchen(zeilen,["E-Mail"],idx);
    const cMit =spalteSuchen(zeilen,["GEV-Mitglied"],idx);
    const cStv =spalteSuchen(zeilen,["Stellv. GEV-Mitglied"],idx);
    const cFk  =spalteSuchen(zeilen,["Mitglied FKn"],idx);
    const cFks =spalteSuchen(zeilen,["stellv. Mitglied FKn"],idx);
    if(cNam<0 || cMit<0) throw new Error("Spalten »Name« und »GEV-Mitglied« nicht gefunden — ist das die Mitgliederliste?");
    const kopfZeile = zeilen.findIndex(z=> String((z||[])[cNam]||"").trim()==="Name");
    const leute=[], faecher=[];
    for(let r=kopfZeile+1;r<zeilen.length;r++){
      const z=zeilen[r]||[];
      const nam=String(z[cNam]==null?"":z[cNam]).trim();
      if(!nam) continue;
      const mit=String(z[cMit]==null?"":z[cMit]).trim();
      const stv=String(z[cStv]==null?"":z[cStv]).trim();
      const istV=/x/i.test(mit), istS=/x/i.test(stv);
      if(!istV && !istS) continue;
      const vor=String((cVor>=0?z[cVor]:"")||"").trim();
      const kl2=String((cGrem>=0?z[cGrem]:"")||"").trim();
      const ma2=String((cMail>=0?z[cMail]:"")||"").trim();
      leute.push({
        vorname:vor, name:nam, voll:(vor?vor+" ":"")+nam, klasse:kl2, mail:ma2,
        id:(vor?vor+" ":"")+nam+"|"+kl2+"|"+ma2, vertreter:istV, stellv:istS
      });
      for(const c of [cFk,cFks]){
        if(c<0) continue;
        String(z[c]==null?"":z[c]).split(",").map(s=>s.trim()).filter(Boolean)
          .forEach(f=>{ if(!faecher.includes(f)) faecher.push(f); });
      }
    }
    return {leute: zusammenlegen(leute), faecher};
  }
  // CSV liest Papa Parse: Trennzeichen wird erkannt, Anführungszeichen,
  // eingebettete Trennzeichen und Zeilenumbrüche inbegriffen.
  function csvLesen(text){
    if(typeof Papa === "undefined")
      throw new Error("Zum Lesen der Vertreterliste fehlt papaparse.min.js neben dieser Seite.");
    const e = Papa.parse(text.replace(/^\uFEFF/, ""), {skipEmptyLines:false});
    return e.data.map(z => z.map(f => String(f == null ? "" : f).trim()));
  }
  async function dateiLaden(file){
    const zeilen=csvLesen(await file.text());
    const erg = auszugLesen(zeilen) || listeLesen(zeilen);
    if(!erg || !erg.leute.length) throw new Error("In der Datei stehen keine Vertreter.");
    // Beim Laden einer Liste bleiben frei eingetippte Namen erhalten
    const frei=S.mitglieder.filter(m=>m.frei && !erg.leute.some(l=>l.voll===m.voll));
    S.mitglieder=erg.leute.concat(frei); S.listeName=file.name;
    // Nur vollständig gleiche Zeilen sind ein Fehler. Gleiche Namen in verschiedenen
    // Klassen sind entweder Namensvettern oder dieselbe Person mit zwei Mandaten.
    const zaehler={};
    erg.leute.forEach(l=> zaehler[l.id]=(zaehler[l.id]||0)+1);
    S.doppelt = [...new Set(erg.leute.filter(l=>zaehler[l.id]>1)
      .map(l=> l.voll + (l.klasse?" ("+l.klasse+")":"")))];
    // Gleicher Name in mehreren Zeilen, aber keine Adresse zum Entscheiden:
    // zwei Personen oder eine mit zwei Mandaten? Das muss ein Mensch klären.
    const nachName={};
    erg.leute.forEach(l=> (nachName[l.voll]=nachName[l.voll]||[]).push(l));
    S.unentscheidbar = Object.keys(nachName).filter(n =>
      nachName[n].length>1 && nachName[n].some(l=>!l.mail))
      .map(n => n + " (" + nachName[n].map(l=>l.klasse||"ohne Klasse").join(", ") + ")");
    // Schon aufgestellte Kandidaturen nachversorgen: fehlt eine Adresse oder die
    // Klasse, wird sie aus der neu geladenen Liste ergänzt. Stimmen bleiben stehen,
    // damit eine nachgereichte Adresse das laufende Protokoll nicht kostet.
    let ergaenzt=0; const unklar=[];
    for(const wg of Object.values(S.wahlgaenge||{})){
      for(const k of (wg.kandidaten||[])){
        // Zuordnung in drei Stufen: Kennung, dann Name mit Klasse, dann Name allein.
        // Bleibt es mehrdeutig, lieber nichts eintragen als die falsche Adresse.
        let m = k.id ? erg.leute.find(l=>l.id===k.id) : null;
        if(!m){
          let treffer = erg.leute.filter(l=>l.voll===k.name);
          if(treffer.length>1 && k.klasse){
            const engerer = treffer.filter(l=>l.klasse===k.klasse);
            if(engerer.length) treffer = engerer;
          }
          if(treffer.length>1){ unklar.push(k.name); continue; }
          m = treffer[0];
        }
        if(!m) continue;
        if(!k.id) k.id=m.id;
        if(!k.mail && m.mail){ k.mail=m.mail; ergaenzt++; }
        if(!k.klasse && m.klasse) k.klasse=m.klasse;
      }
    }
    S.nachversorgt = ergaenzt;
    S.unklar = [...new Set(unklar)];
    // Bringt die Datei keine Fächer mit, bleiben die eingetragenen stehen
    if(erg.faecher.length) fachbloeckeAngleichen(erg.faecher);
    sichern(); zeichnen();
  }

  /* ================= Sichern ================= */
  function unberuehrt(d){
    return (d.kandidaten||[]).length===0
        && (d.art||"offen")==="offen" && d.blockwahl!==false
        && !d.stichwahl && !String(d.reihenfolge||"").trim()
        && (d.sitze==null || String(d.sitze).trim()==="")
        && ["abgegeben","enth","ung","nein","leitung","bemerkung","block","blockNein","blockEnth"]
             .every(k=> !String(d[k]==null?"":d[k]).trim());
  }
  function nutzdaten(){
    // Jeder Wahlgang bekommt seinen Eintrag schon, wenn die Schiene ihn zeichnet.
    // Was niemand angefasst hat, gehoert nicht in die Datei — beim Laden entsteht
    // es ohnehin wieder mit denselben Vorgaben.
    const wg={};
    for(const k in S.wahlgaenge) if(!unberuehrt(S.wahlgaenge[k])) wg[k]=S.wahlgaenge[k];
    // faecher steht abgeleitet mit in der Datei, damit eine aeltere Fassung des
    // Werkzeugs den Stand noch lesen kann; geladen wird fachbloecke.
    return {kopf:S.kopf, mitglieder:S.mitglieder, faecher:faecherListe(), fachbloecke:S.fachbloecke||[],
            leitungen:S.leitungen||[],
            wahlgaenge:wg, aktiv:S.aktiv, ansicht:S.ansicht, listeName:S.listeName};
  }
  async function verbinden(){
    try{ downloads = await window.claude?.use?.("downloads") ?? null; }catch(e){ downloads=null; }
    zeichnen();
  }
  function sichern(){
    clearTimeout(speicherTimer);
    speicherTimer=setTimeout(()=>{
      try{ localStorage.setItem(SCHLUESSEL, JSON.stringify(nutzdaten())); }catch(e){}
    },500);
  }
  function wiederherstellen(){
    try{
      const roh=localStorage.getItem(SCHLUESSEL) || localStorage.getItem(SCHLUESSEL_ALT);
      if(!roh) return;
      const d=JSON.parse(roh);
      if(d && d.kopf){ Object.assign(S, leerstand(), d); umstellen(); }
    }catch(e){}
  }
  function stand(){
    return new Blob([JSON.stringify(nutzdaten(),null,1)],{type:"application/json"});
  }

  /* ================= Schiene ================= */
  // Die Einrichtung ist die erste Station, nicht eine Seite nebenan: dorthin geht
  // man zu Beginn und immer dann zurueck, wenn etwas fehlt.
  function kopfVollstaendig(){
    return ["schule","datum","wahlleitung","anwesendW","anwesendS"]
      .every(x=> String(S.kopf[x]||"").trim());
  }
  function statusEinrichtung(){
    const kopfDa=kopfVollstaendig();
    if(!S.mitglieder.length && !kopfDa) return "offen";
    return (S.mitglieder.length && kopfDa) ? "fertig" : "laeuft";
  }
  // Das Protokoll ist fertig, wenn jeder begonnene Wahlgang gezaehlt und angenommen ist
  function statusProtokoll(){
    let kand=false, offen=false;
    for(const seite of wgListe()) for(const t of seite.teile){
      const dd=daten(t.id);
      if(!dd.kandidaten.length) continue;
      kand=true;
      if(!dd.kandidaten.some(k=>k.stimmen!=="" && k.stimmen!=null)) offen=true;
      else if(gewaehlt(t.id).some(k=>k.annahme!=="ja")) offen=true;
    }
    if(!kand) return "offen";
    return (!offen && kopfVollstaendig()) ? "fertig" : "laeuft";
  }

  /* ================= Bühne ================= */

  // Nach dem Verlassen eines Feldes wird neu gezeichnet, damit Haken und Hinweise stimmen.
  // Gezeichnet wird erst, wenn der Eingabepunkt angekommen ist, und danach wieder auf
  // dasselbe Feld gesetzt — sonst reisst das Weitertippen mit der Tabulatortaste ab.
  let malTimer=null;
  function spaeterZeichnen(){
    clearTimeout(malTimer);
    malTimer=setTimeout(()=>{
      const a=document.activeElement||{}, id=a.id||"";
      const von=a.selectionStart, bis=a.selectionEnd;
      zeichnen();
      const n=id ? document.getElementById(id) : null;
      if(!n || !n.focus) return;
      n.focus();
      try{ if(von!=null) n.setSelectionRange(von,bis); }catch(e){}
    },0);
  }

    const b=el("span","knopf","Vertreterliste laden"); lab.append(inp,b); k3.append(lab);
    const info=el("div","liste-info");
    if(S.mitglieder.length){

    if((S.unentscheidbar||[]).length) meldung(k3,

    if((S.doppelt||[]).length) meldung(k3,

    const lf=el("label","feld");

    const i4=document.createElement("input"); i4.id="feld_tk"; i4.value=S.kopf.teilkonferenz||"";
    i4.oninput=()=>{ S.kopf.teilkonferenz=i4.value; sichern(); railZeichnen(); };
    l4.append(i4); k4.append(l4);

    k5.append(el("p",null,"Die ganze Sitzung: Kopfdaten, Kandidaturen, Stimmen und Namensvorrat. Sie liegt im Browser dieses Rechners und übersteht ein Neuladen. Gesichert wird oben in der Leiste oder mit Strg+S."));
    const lz=el("label","datei");

    iz.onchange=async e=>{

      if(!j || !j.kopf){ meldung(k5,"Das ist kein gesicherter Stand."); return; }
      // Damit dieselbe Datei nach einem Abbruch erneut gewählt werden kann
      iz.value="";
      // Der Leerstand davor raeumt Schluessel weg, die die Datei nicht mitbringt
      const uebernehmen=()=>{ Object.assign(S, leerstand(), j); umstellen(); sichern(); zeichnen(); };
      // Ein Stand ersetzt die ganze Sitzung. Stehen schon Stimmen, erst fragen.
      if(!etwasDa()){ uebernehmen(); return; }
      const kasten=el("div","hinweis");

      const knoepfe=el("div","fussleiste");

    // Drei Rücksetzknöpfe, gleiche Mechanik: erster Klick fragt, zweiter führt aus.

    // stehen, und es wird immer gefragt — auch wenn nichts mehr da ist, sonst sieht

    function ruecksetzknopf(titel, tun){
      const b=el("button","knopf", scharferKnopf===titel ? "Wirklich? "+titel : titel);

        d.kandidaten.forEach(k=>{ k.stimmen=""; k.nein=""; k.enth=""; k.stimmen2=""; k.annahme=""; });
        d.nein=""; d.enth=""; d.ung=""; d.abgegeben=""; d.stichwahl=false; d.reihenfolge="";
        d.block=""; d.blockNein=""; d.blockEnth="";
        if(auchKandidaturen) d.kandidaten=[];
      }
    };
    const zr=el("div","fussleiste knopfspalte");
    zr.append(lz,
      ruecksetzknopf("Stimmen zurücksetzen", ()=> stimmenWeg(false)),
      ruecksetzknopf("Stimmen und Kandidaturen zurücksetzen", ()=> stimmenWeg(true)),
      ruecksetzknopf("Alles zurücksetzen", ()=>{
        try{ localStorage.removeItem(SCHLUESSEL); localStorage.removeItem(SCHLUESSEL_ALT); }catch(e){}
        Object.assign(S, leerstand());
      }));
    k5.append(zr);
    karten.append(k5);

    f.append(karten);
    // Die Lizenz reist mit der Datei: wer nur index.html weitergibt, gibt sie sonst
    // ohne LICENSE weiter. Steht hier, weil diese Seite waehrend der Wahl nicht an der Wand ist.
    const liz=el("div","lizenz");
    liz.append(document.createTextNode("GEV-Wahlhelfer · © 2026 P. Kövesdi · MIT-Lizenz · "));
    const lizA=document.createElement("a");
    lizA.href="https://github.com/pkoevesdi/gev-wahlhelfer";
    lizA.textContent="github.com/pkoevesdi/gev-wahlhelfer";

    liz.append(lizA);

  }
  function meldung(wo,txt){ const m=el("div","hinweis",txt); wo.append(m); }
  // Laden und Zuruecksetzen loeschen beide die Sitzung. Gewarnt wird, sobald etwas
  // darin steht — vorher waere die Warnung nur im Weg.
  function etwasDa(){
    return S.mitglieder.length>0
        || Object.values(S.wahlgaenge||{}).some(w => (w.kandidaten||[]).length>0)
        || ["schule","wahlleitung","wahlhelfer","anwesendW","anwesendS","teilkonferenz"]
             .some(x => String(S.kopf[x]||"").trim())
        || faecherListe().length>0;
  }

  function wahlgangZeichnen(f){
    const liste=wgListe();
    const seite = liste.find(x=>x.id===S.aktiv) || liste[0];
    S.aktiv=seite.id;

    const kz=el("div","kopfzeile");
    kz.append(el("div","eyebrow", seite.gruppe + (seite.fachblock ? "  ·  "+seite.fachblock : "")));
    f.append(kz);
    f.append(el("h2","titel", seite.titel));
    f.append(el("div","unterzeile",
      seite.teile.map(t=> t.label+" "+sitzeText(t)).join("  ·  ")));

    seite.teile.forEach((teil,ti)=> teilZeichnen(f, teil, ti));
  }

  // Sonderregeln und Eingabefehler eines Wahlgangs. Jede Meldung erscheint nur,
  // wenn sie zutrifft; der Normalfall bleibt still.
  function seiteVon(teilId){
    return wgListe().find(x=> x.teile.some(t=> t.id===teilId));
  }
  function namensliste(txt){
    return String(txt||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean);
  }
  // Der Vorrat sind die Namen, die in dieser Sitzung schon geleitet haben, dazu die
  // von Hand aufgenommenen. Die Vertreterliste taugt dafuer nicht: leiten darf auch,
  // wer der Versammlung nicht angehoert.
  function leitungsVorrat(){
    // Die Wahlhelfenden stehen mit im Vorrat: sie sind da und kandidieren im jeweiligen
    // Wahlgang ohnehin nicht — SchulGWahlO § 4 Absatz 4.
    const v=namensliste(S.kopf.wahlleitung);
    for(const n of namensliste(S.kopf.wahlhelfer)) if(!v.includes(n)) v.push(n);
    for(const id in S.wahlgaenge)
      for(const n of namensliste(S.wahlgaenge[id].leitung)) if(!v.includes(n)) v.push(n);
    for(const n of (S.leitungen||[])) if(!v.includes(n)) v.push(n);
    return v;
  }
  // Beim Tippen schlaegt das Feld zusaetzlich die Vertreterliste vor — oft leitet
  // doch jemand aus der Runde.
  function leitungsVorschlaege(){
    const v=leitungsVorrat();
    for(const m of S.mitglieder) if(m.voll && !v.includes(m.voll)) v.push(m.voll);
    return v;
  }
  // Ohne eigene Angabe leitet die erste Person aus dem Kopf. Stehen dort mehrere,
  // sind die uebrigen nur Vorrat und werden im Wahlgang angeklickt.
  function leitungAus(d){
    return d.leitung ? namensliste(d.leitung) : namensliste(S.kopf.wahlleitung).slice(0,1);
  }
  function leitungVon(id){ return leitungAus(daten(id)); }
  // Wahlgaenge, ueber die abgestimmt wurde — nur die zaehlen fuer den Kopf
  function gefuehrteWahlgaenge(){
    const raus=[];
    for(const seite of wgListe()) for(const t of seite.teile)
      if(daten(t.id).kandidaten.length) raus.push(t.id);
    return raus;
  }
  // Im Kopf steht, wer die meisten Wahlgaenge geleitet hat
  function hauptLeitung(){
    const zaehler=new Map();
    for(const id of gefuehrteWahlgaenge()){
      const s=leitungVon(id).join(", ");
      if(s) zaehler.set(s, (zaehler.get(s)||0)+1);
    }
    let beste="", n=0;
    for(const [s,c] of zaehler) if(c>n){ beste=s; n=c; }
    return beste || namensliste(S.kopf.wahlleitung).join(", ");
  }
  // Unterschrieben wird von allen, die mindestens einen Wahlgang geleitet haben
  function alleLeitungen(){
    const raus=[];
    for(const id of gefuehrteWahlgaenge())
      for(const n of leitungVon(id)) if(!raus.includes(n)) raus.push(n);
    return raus.length ? raus : namensliste(S.kopf.wahlleitung);
  }
  function pruefen(teil, sitze, reihen, gezaehlt){
    const d=daten(teil.id), raus=[];
    const anzZ=Number(String(S.kopf.anwesendS||"").trim());
    const gew=gezaehlt ? gewaehlt(teil.id) : [];
    const art=erfassungD(d, sitze), jp=dreiZahlen(art);
    const summe=k=> jp ? zahl(k.stimmen)+zahl(k.nein)+zahl(k.enth) : zahl(k.stimmen);

    // Gleichstand: an der Sitzgrenze entscheidet er, wer gewaehlt ist, sonst nur die Reihenfolge
    let grenzgleich=false;
    if(gezaehlt && reihen.length>sitze){
      const grenze=Number(reihen[sitze-1]?.stimmen)||0;
      if(grenze>0 && (Number(reihen[sitze]?.stimmen)||0)===grenze){
        grenzgleich=true;
        if(!d.stichwahl) raus.push("Stimmengleichheit an der Sitzgrenze bei "+grenze
          +" Stimmen — Stichwahl, bei erneuter Gleichheit das Los.");
      }
    }
    // Mehr Stimmen als anwesende Stimmen
    if(anzZ>0){
      const zuviel=reihen.filter(k=> summe(k)>anzZ).map(k=>k.name);
      if(zuviel.length) raus.push("Mehr Stimmen als Stimmberechtigungen ("+anzZ+"): "+zuviel.join(", ")+".");
    }
    // Bei offener Wahl muss die Rechnung mit den Stimmberechtigungen aufgehen. Gemeldet
    // wird erst, wenn ueberall eine Ja-Zahl steht — sonst blinkt es beim Eintippen.
    if(jp && anzZ>0 && (d.art||"offen")!=="geheim" && reihen.length && dreiGezaehlt(teil.id)
       && reihen.every(k=> String(k.stimmen==null?"":k.stimmen).trim()!=="")){
      const schief=reihen.filter(k=> summe(k)!==anzZ);
      if(schief.length && art==="block")
        raus.push("Ja, Nein und Enthaltung ergeben "+summe(schief[0])+" statt der "
          +anzZ+" Stimmberechtigungen.");
      else if(schief.length)
        raus.push("Ja, Nein und Enthaltung ergeben nicht die "+anzZ+" Stimmberechtigungen: "
          +schief.map(k=> k.name+" ("+summe(k)+")").join(", ")+".");
    }
    // Ueber jede Person einzeln abgestimmt: gewaehlt ist nur, wer mehr Ja als Nein hat
    if(jp && gezaehlt){
      const durch=reihen.filter(k=> (zahl(k.stimmen)||zahl(k.nein)) && zahl(k.nein)>=zahl(k.stimmen))
                        .map(k=> k.name+" ("+zahl(k.stimmen)+" Ja, "+zahl(k.nein)+" Nein)");
      if(durch.length) raus.push("Nicht mehr Ja- als Nein-Stimmen, also nicht gewählt: "+durch.join(", ")+".");
    }
    // Bei geheimer Wahl muss die Rechnung mit den verteilten Zetteln aufgehen

      if(drueber.length) raus.push("Mehr Ja-Stimmen als verteilte Stimmzettel ("+z+"): "+drueber.join(", ")+".");
      // Ja/Nein/Enthaltung je Person gibt es nur ohne Auswahl; dann muss die Summe passen

        const schief=reihen.filter(k=>(summe(k)+rest)!==z)
                           .map(k=>k.name+" ("+(summe(k)+rest)+")");
        if(schief.length) raus.push("Ja, Nein, Enthaltungen und ungültige Stimmen ergeben nicht die "
          +z+" verteilten Stimmzettel: "+schief.join(", ")+".");
      }
    }
    // Gleiche Stimmenzahl ohne Streit um einen Sitz: nur die Reihenfolge ist offen
    if(gezaehlt && !grenzgleich && gleichstand(teil.id) && !d.reihenfolge)
      raus.push("Gleiche Stimmenzahl — die Reihenfolge entsteht durch Einvernehmen oder Los "
                +"und ist mit den Pfeilen zu setzen.");

    if(d.blockwahl && sitze!==Infinity && reihen.length>sitze)

                +reihen.length+" auf "+sitze+".");

    if(reihen.length && sitze!==Infinity && reihen.length<sitze)
      raus.push(reihen.length+" Kandidaturen auf "+sitze+" Sitze — "+(sitze-reihen.length)+" bleiben unbesetzt.");
    if(teil.id==="stellv_vorsitz" && d.sitze!=null && d.sitze!=="" && Number(d.sitze)<1)
      raus.push("Für den Vorsitz ist mindestens eine Stellvertretung zu wählen.");

    // Wer in zwei Fachkonferenzen desselben Blocks als beratendes Mitglied aufgestellt

    if(teil.id.indexOf("fk::")===0){

      for(const nachbar of fachblockNachbarn(fach)){

          if(auch) doppelt.push(auch.name+" ("+nachbar+")");
        }

        +" aufgestellt: "+[...new Set(doppelt)].join(", ")+".");

        }
      }

        +[...new Set(doppelt)].join(", ")+".");
    }

    function aufnehmenJetzt(p, name){

        // Frei eingetippt: für diese Sitzung in den Bestand, damit die Suche ihn im

        i.placeholder = vorgabe || "0";
        i.oninput=()=>{
          const v=i.value.replace(/[^0-9]/g,""); i.value=v;
          d.kandidaten.forEach(k=> k[key]=v);
          sichern();
        };
        i.onblur=spaeterZeichnen;
        lb.append(i);
      };
      ergFeld("stimmen","Ja", anz || "—");
      ergFeld("nein","Nein","");
      ergFeld("enth","Enthaltung","");
      fu.append(lb);
    } else {
    // Traegt bei allen dieselbe Zahl ein. Vorgeschlagen ist die volle Stimmenzahl,
    // also Einstimmigkeit.
    const l3=el("label"); l3.append(el("span",null,"Alle auf"));
    const felder={};
    const alleFeld=(key, lab, vorgabe)=>{
      if(lab) l3.append(el("span",null,lab));
      const i=document.createElement("input");
      i.className="zahl"; i.inputMode="numeric"; i.id=key+"_"+w.id;
      i.value = d[key]!=null && d[key]!=="" ? d[key] : (vorgabe||"");
      i.placeholder = vorgabe || "0";
      i.oninput=()=>{ d[key]=i.value.replace(/[^0-9]/g,""); i.value=d[key]; sichern(); };
      l3.append(i); felder[key]=i;
    };
    alleFeld("block", jp?"Ja":"", anz || "—");
    if(jp){ alleFeld("blockNein","Nein",""); alleFeld("blockEnth","Enthaltung",""); }
    const be=el("button","knopf","übernehmen");
    be.disabled = !d.kandidaten.length;
    be.title = !d.kandidaten.length ? "Noch niemand aufgestellt"
             : jp ? "Jede Kandidatur bekommt die nebenstehenden Zahlen"
                  : "Jede Kandidatur bekommt die nebenstehende Stimmenzahl";
    be.onclick=()=>{
      const v=String(felder.block.value||"").trim();
      if(!v) return;
      const n=jp ? String(felder.blockNein.value||"").trim() : "";
      const e=jp ? String(felder.blockEnth.value||"").trim() : "";
      d.kandidaten.forEach(k=>{ k.stimmen=v; if(jp){ k.nein=n; k.enth=e; } });
      sichern(); zeichnen();
    };
    l3.append(be);
    fu.append(l3);
    }
    // Bemerkung: alles, wofür es kein Feld gibt — Losentscheid, Wiederholung, Zwischenfall
    const lm=el("label","breitzeile"); lm.append(el("span",null,"Bemerkung"));
    const im=document.createElement("input"); im.className="breiter"; im.id="bem_"+w.id;
    im.placeholder="steht in der Niederschrift unter diesem Wahlgang";
    im.value=d.bemerkung||""; im.oninput=()=>{ d.bemerkung=im.value; sichern(); };
    lm.append(im); fu.append(lm);
    block.append(fu);

    f.append(block);
  }

  /* ================= Bedienung ================= */
  // Im Vollbild wird groesser gezeichnet. Drei Wege, weil F11 je nach Browser
  // anders zu erkennen ist: die Vollbild-Schnittstelle, die Anzeigeart und
  // zuletzt der Vergleich von Fensterhoehe und Bildschirmhoehe.
  function grossPruefen(){
    let voll=false;
    try{
      voll = !!document.fullscreenElement
          || (window.matchMedia && matchMedia("(display-mode: fullscreen)").matches)
          || (window.screen && screen.height>0
                            && window.innerHeight >= screen.height-2
                            && window.innerWidth  >= screen.width-2);
    }catch(e){}
    document.body.classList.toggle("gross", voll);
  }
  window.addEventListener("resize", grossPruefen);
  document.addEventListener("fullscreenchange", grossPruefen);
  /* ================= Protokoll =================
     Die Niederschrift entsteht hier und wird ueber den Druckdialog des Browsers
     zur PDF: Ziel „Als PDF speichern“, Kopf- und Fusszeilen des Browsers aus. */
  function ptab(spalten, zeilen, klasse){
    const t=el("table", klasse||null);
    const kopf=document.createElement("thead"), kz=el("tr");
    spalten.forEach(c=> kz.append(el("th",null,c.kopf)));
    kopf.append(kz); t.append(kopf);
    const tb=document.createElement("tbody");
    (zeilen.length?zeilen:[{}]).forEach(z=>{
      const tr=el("tr");
      spalten.forEach(c=>{
        const leer = z[c.k]==null || z[c.k]==="";
        tr.append(el("td", (c.klasse||"")+(leer?" leer":""), leer?"—":String(z[c.k])));
      });
      tb.append(tr);
    });
    t.append(tb); return t;
  }
  // Die Wahlen liegen am Schuljahresanfang; das Schuljahr folgt aus dem Datum.
  function schuljahr(){
    const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(String(S.kopf.datum||"").trim());
    const dt = m ? new Date(+m[3], +m[2]-1, +m[1]) : new Date();
    const j = dt.getMonth()>=7 ? dt.getFullYear() : dt.getFullYear()-1;
    return j+"/"+(j+1);
  }
  function metaText(d, sitze){
    const art=(d.art||"offen")==="geheim" ? "geheim" : "offen";
    const teile=[];
    if(sitze!=null && sitze!==Infinity) teile.push("Zu wählen: "+sitze);
    teile.push("Art der Wahl: "+art+(d.blockwahl?", im Block":""));
    // Wurde ueber jede Person einzeln abgestimmt, stehen Nein und Enthaltung in der
    // Tabelle; sonst gelten sie fuer den ganzen Wahlgang und gehoeren hierher.
    if(!dreiZahlen(erfassungD(d, sitze))){
      if(d.nein) teile.push("Nein: "+d.nein);
      teile.push("Enthaltungen: "+(d.enth||"0"));
    }
    if(art==="geheim"){
      teile.push("ungültige Stimmen: "+(d.ung||"0"));
      teile.push("verteilte Stimmzettel: "+(d.abgegeben||"—"));
    }
    if(d.reihenfolge) teile.push("Reihenfolge "
      + (d.reihenfolge==="los" ? "durch Los" : "durch Einvernehmen"));
    return teile.join("   ·   ");
  }
  function pmeta(d, sitze){ return el("p","pmeta", metaText(d, sitze)); }
  // Wer einen einzelnen Wahlgang geleitet hat, steht unter dessen Überschrift —
  // so wie die Wahlleitung im Kopf des Protokolls.
  function leitungAbweichend(d){
    const wl=leitungAus(d).join(", ");
    return (wl && wl!==hauptLeitung()) ? wl : "";
  }
  function pleitung(wl){
    const r=el("div","pzeile");
    r.append(el("b",null,"Wahlleitung"), el("span",null,wl));
    return r;
  }
  // Bei gleicher Wahlart und Stimmenlage steht eine Zeile fuer alle Faecher
  function pmetaFaecher(wo, praefix, faecher){
    const t=faecher.map(f=> metaText(daten(praefix+f), sitzeFuer(praefix+f)));
    if(t.every(x=> x===t[0])) wo.append(el("p","pmeta", t[0]+"   ·   für alle Fachkonferenzen"));
    else faecher.forEach((f,i)=> wo.append(el("p","pmeta", f+":   "+t[i])));
  }
  // Gewaehlt ist, wer die meisten Stimmen hat. Wer die Wahl ablehnt, rueckt heraus,
  // der Sitz faellt an die naechste Kandidatur.
  // Wird ueber jede Person einzeln abgestimmt, ist nur gewaehlt, wer mehr Ja als Nein hat.
  function gewaehlt(id){
    const n=sitzeFuer(id), jp=dreiZahlen(erfassungVon(id));
    const a=sortiert(id).filter(k=>(Number(k.stimmen)||0)>0 && k.annahme!=="nein"
                               && !(jp && zahl(k.nein)>=zahl(k.stimmen)));
    return n===Infinity ? a : a.slice(0,n);
  }
  function teilProtokoll(wo, teil){
    const d=daten(teil.id);
    if(!d.kandidaten.length) return;
    const reihen=sortiert(teil.id);
    const ab=el("div","abschnitt");
    // Der Wahlgang ueberschreibt seine beiden Tabellen, so wie auf dem Schirm auch
    ab.append(el("h3",null, teil.label+" ("+sitzeText(teil)+")"));
    const wl=leitungAbweichend(d);
    if(wl) ab.append(pleitung(wl));
    const hatStich=reihen.some(k=> String(k.stimmen2||"").trim()!=="");
    const jp=dreiZahlen(erfassungVon(teil.id)) && dreiGezaehlt(teil.id);
    const kspalten=[{kopf:"Name",k:"name"},{kopf:jp?"Ja":"Stimmen",k:"stimmen",klasse:"z"}];
    if(jp) kspalten.push({kopf:"Nein",k:"nein",klasse:"z"},{kopf:"Enthaltung",k:"enth",klasse:"z"});
    if(hatStich) kspalten.push({kopf:"Stichwahl",k:"stimmen2",klasse:"z"});
    ab.append(el("h4",null,"Kandidierende"));
    ab.append(ptab(kspalten, reihen.map(k=>({name:k.name, stimmen:k.stimmen, stimmen2:k.stimmen2,
      nein:nullzahl(k,k.nein), enth:nullzahl(k,k.enth)}))));
    ab.append(pmeta(d, sitzeVon(teil)));
    if(String(d.bemerkung||"").trim()) ab.append(el("p","pmeta","Bemerkung: "+d.bemerkung.trim()));
    const gew=gewaehlt(teil.id);
    // Stellvertretungen ruecken in der Reihenfolge der Stimmenzahl nach
    const stv=teil.label.indexOf("Stellv")===0;
    const sp = stv ? [{kopf:"#",k:"rang",klasse:"r"},{kopf:"Name",k:"name"},{kopf:"E-Mail",k:"mail"}]
                   : [{kopf:"Name",k:"name"},{kopf:"E-Mail",k:"mail"}];
    ab.append(el("h4",null,"Gewählt"));
    ab.append(ptab(sp, gew.map((k,i)=>({rang:i+1, name:k.name, mail:k.mail})), "erg"));
    // Die Amtszeit beginnt mit der Annahme; offene und abgelehnte Wahlen gehoeren ins Protokoll
    const offen=gew.filter(k=>k.annahme!=="ja").map(k=>k.name);
    const nein=reihen.filter(k=>k.annahme==="nein").map(k=>k.name);
    if(offen.length) ab.append(el("p","pmeta","Annahme offen: "+offen.join(", ")));
    if(nein.length)  ab.append(el("p","pmeta","Wahl nicht angenommen: "+nein.join(", ")));
    wo.append(ab);
  }
  function protokollKopf(){
    const d=document.createElement("div");
    d.append(el("h1",null,"Niederschrift über die Wahlen in der Gesamtelternvertretung"));
    d.append(el("div","pjahr","Schuljahr "+schuljahr()));
    const z=(lab,wert,zusatz)=>{ const r=el("div","pzeile");
      const w=el("span",null,wert||"—");
      if(zusatz) w.append(el("span","pklein", "   "+zusatz));
      r.append(el("b",null,lab), w); d.append(r); };
    z("Schule", S.kopf.schule);
    z("Datum, Uhrzeit", S.kopf.datum);
    // Einzelne Wahlgaenge nennen ihre Leitung selbst
    z("Wahlleitung", hauptLeitung(), "wo nicht anders vermerkt");
    if(String(S.kopf.wahlhelfer||"").trim()) z("Wahlhelfende", S.kopf.wahlhelfer);
    d.append(el("p","psatz",
      "Anwesend sind "+(S.kopf.anwesendW||"—")+" Wahlberechtigte mit insgesamt "
      +(S.kopf.anwesendS||"—")+" Stimmen. Das Quorum von einem Drittel der Stimmen ist "
      +(S.kopf.quorum||"erfüllt")+"; die Anwesenheit ist in einer Anlage zu dieser Niederschrift festgehalten."));
    return d;
  }
  function annahmeZeilen(wo, praefix, faecher){
    const offen=[], nein=[];
    faecher.forEach(fa=>{
      gewaehlt(praefix+fa).filter(k=>k.annahme!=="ja").forEach(k=> offen.push(fa+": "+k.name));
      sortiert(praefix+fa).filter(k=>k.annahme==="nein").forEach(k=> nein.push(fa+": "+k.name));
    });
    if(offen.length) wo.append(el("p","pmeta","Annahme offen: "+offen.join(", ")));
    if(nein.length)  wo.append(el("p","pmeta","Wahl nicht angenommen: "+nein.join(", ")));
  }
  function protokollZeichnen(f){
    const kz=el("div","kopfzeile nodruck"); kz.append(el("h2","titel","Niederschrift")); f.append(kz);
    f.append(el("div","unterzeile nodruck",
      "Im Druckdialog „Als PDF speichern“ wählen und die Kopf- und Fußzeilen des Browsers abschalten."));
    const leiste=el("div","fussleiste nodruck");
    const dr=el("button","knopf stark","Drucken"); dr.onclick=()=> window.print();
    leiste.append(dr); f.append(leiste);

    const fehlt=[["schule","Schule"],["datum","Datum"],["wahlleitung","Wahlleitung"],
                 ["anwesendW","Anwesende"],["anwesendS","Stimmen"]]
      .filter(([k])=> !String(S.kopf[k]||"").trim()).map(([,lab])=>lab);
    if(fehlt.length){
      const m=el("div","hinweis nodruck","Im Kopf fehlt noch: "+fehlt.join(", ")+".");
      f.append(m);
    }
    const ohne=[], offenAn=[];
    for(const seite of wgListe()) for(const t of seite.teile){
      const dd=daten(t.id);
      if(!dd.kandidaten.length) continue;
      if(!dd.kandidaten.some(k=>k.stimmen!=="" && k.stimmen!=null)) ohne.push(seite.titel+" — "+t.label);
      else if(gewaehlt(t.id).some(k=>k.annahme!=="ja")) offenAn.push(seite.titel+" — "+t.label);
    }
    if(ohne.length) f.append(el("div","hinweis nodruck","Noch ohne Stimmen: "+ohne.join(" · ")+"."));
    if(offenAn.length) f.append(el("div","hinweis nodruck","Annahme noch offen: "+offenAn.join(" · ")+"."));

    const prot=el("div","prot");
    const seiten=wgListe();
    const istFach=w=> w.id.indexOf("fkseite::")===0;
    const hatKandidaten=w=> w.teile.some(t=> daten(t.id).kandidaten.length);
    let erstes=true;
    const blatt=()=>{ const b=el("div","blatt");
      if(erstes){ b.append(protokollKopf()); erstes=false; } return b; };

    for(const w of seiten.filter(x=> !istFach(x) && hatKandidaten(x))){
      const b=blatt();
      b.append(el("h2",null,w.titel));
      w.teile.forEach(t=> teilProtokoll(b,t));
      prot.append(b);
    }
    // Alle Fachkonferenzen in vier Tabellen statt je Fach eine eigene Seite
    const F=faecherListe().filter(f=> daten("fk::"+f).kandidaten.length
                              || daten("fks::"+f).kandidaten.length);
    if(F.length){
      const SF={kopf:"Fach",k:"fach",klasse:"f"}, SN={kopf:"Name",k:"name"},
            SZ={kopf:"Stimmen",k:"stimmen",klasse:"z"}, SM={kopf:"E-Mail",k:"mail"},
            SR={kopf:"#",k:"rang",klasse:"r"};
      const sammeln=(praefix, erg)=>{
        const a=[];
        F.forEach(f=>{
          const jpf=dreiZahlen(erfassungVon(praefix+f)) && dreiGezaehlt(praefix+f);
          (erg?gewaehlt(praefix+f):sortiert(praefix+f)).forEach((k,i)=>
            a.push({fach:f, rang:i+1, name:k.name, stimmen:k.stimmen, stimmen2:k.stimmen2, mail:k.mail,
                    nein: jpf?nullzahl(k,k.nein):"", enth: jpf?nullzahl(k,k.enth):""}));
        });
        return a;
      };
      const SS={kopf:"Stichwahl",k:"stimmen2",klasse:"z"};
      const SJ={kopf:"Ja",k:"stimmen",klasse:"z"},
            SNe={kopf:"Nein",k:"nein",klasse:"z"}, SEn={kopf:"Enthaltung",k:"enth",klasse:"z"};
      const stichDa=pre=> F.some(f=> daten(pre+f).kandidaten.some(k=> String(k.stimmen2||"").trim()!==""));
      // Wurde in einem Fach ueber jede Person einzeln abgestimmt, bekommt die
      // gemeinsame Tabelle die Spalten Nein und Enthaltung. „Ja" steht ueber der
      // ersten Spalte nur, wenn das fuer alle Faecher gilt.
      const kspaltenF=pre=>{
        const dg=f=> dreiZahlen(erfassungVon(pre+f)) && dreiGezaehlt(pre+f);
        const alle=F.every(dg), eins=F.some(dg);
        const s=[SF, SN, alle?SJ:SZ];
        if(eins) s.push(SNe, SEn);
        if(stichDa(pre)) s.push(SS);
        return s;
      };
      const leitZeilen=(wo,pre)=>{
        const l=F.map(f=>[f, leitungAbweichend(daten(pre+f))]).filter(x=>x[1]);
        if(!l.length) return;
        const eins=l.length===F.length && l.every(x=>x[1]===l[0][1]);
        wo.append(pleitung(eins ? l[0][1] : l.map(x=>x[0]+": "+x[1]).join(" · ")));
      };
      const bemZeilen=(wo,pre)=>{
        const b=F.filter(f=> String(daten(pre+f).bemerkung||"").trim())
                 .map(f=> f+": "+daten(pre+f).bemerkung.trim());
        if(b.length) wo.append(el("p","pmeta","Bemerkung — "+b.join(" · ")));
      };
      // Ein Blatt je Wahlgang, wie bei den uebrigen Gremien auch. Wo die Seite bricht,
      // entscheidet der Browser.
      const b=blatt();
      b.append(el("h2",null,"Fachkonferenzen"));
      b.append(el("h3",null,"Beratende Mitglieder"));
      leitZeilen(b,"fk::");
      b.append(el("h4",null,"Kandidierende"));
      b.append(ptab(kspaltenF("fk::"), sammeln("fk::",false)));
      pmetaFaecher(b,"fk::",F); bemZeilen(b,"fk::");
      b.append(el("h4",null,"Gewählt"));
      b.append(ptab([SF,SN,SM], sammeln("fk::",true), "erg"));
      annahmeZeilen(b, "fk::", F);
      prot.append(b);
      const b2=blatt();
      b2.append(el("h2",null,"Fachkonferenzen"));
      b2.append(el("h3",null,"Stellvertretung"));
      leitZeilen(b2,"fks::");
      b2.append(el("h4",null,"Kandidierende"));
      b2.append(ptab(kspaltenF("fks::"), sammeln("fks::",false)));
      pmetaFaecher(b2,"fks::",F); bemZeilen(b2,"fks::");
      b2.append(el("h4",null,"Gewählt"));
      b2.append(ptab([SF,SR,SN,SM], sammeln("fks::",true), "erg"));
      annahmeZeilen(b2, "fks::", F);
      prot.append(b2);
    }
    const b=blatt();
    b.append(el("h2",null,"Abschluss"));
    b.append(el("p","psatz",
      "Die Wahlleitung bestätigt mit ihrer Unterschrift die Richtigkeit dieser Niederschrift."));
    const u=el("div","unters");
    alleLeitungen().forEach(n=> u.append(el("div",null,n+" — Wahlleitung, Datum")));
    if(!u.children.length) u.append(el("div",null,"Wahlleitung, Datum"));
    b.append(u);
    b.append(el("div","fuss", (S.kopf.schule||"")+"   ·   Schuljahr "+schuljahr()
      +(S.kopf.datum?"   ·   "+S.kopf.datum:"")));
    prot.append(b);

    f.append(prot);
  }

  // Welcher Ruecksetzknopf gerade gefragt hat. Am Namen statt am Element, sonst geht
  // die Frage beim Neuzeichnen verloren und der naechste Klick fragt wieder.
  let scharferKnopf=null, scharfUhr=null;
  let toastTimer=null;
  function toast(txt){
    document.querySelectorAll(".toast").forEach(t=>t.remove());
    const t=el("div","toast",txt); document.body.append(t);
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(), 2200);
  }
  // Dateiname nach ISO, Datum und Uhrzeit durch Unterstrich getrennt: 2026-09-21_19-30.
  // Der Doppelpunkt der ISO-Zeit wird zum Bindestrich, sonst stolpern andere Dateisysteme.
  function dateiZeit(){
    const t=String(S.kopf.datum||"");
    const d=/(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(t);
    const u=/(\d{1,2}):(\d{2})/.exec(t);
    const zwei=n=>String(n).padStart(2,"0");
    if(!d) return t.replace(/[^0-9A-Za-z]+/g,"-").replace(/^-+|-+$/g,"");
    return d[3]+"-"+zwei(d[2])+"-"+zwei(d[1]) + (u ? "_"+zwei(u[1])+"-"+u[2] : "");
  }
  async function standSichern(){
    const name="GEV-Wahlstand"+(dateiZeit()?"-"+dateiZeit():"")+".json";
    const blob=stand();
    try{
      if(downloads){ await downloads.save({filename:name, data:new Uint8Array(await blob.arrayBuffer())}); }
      else{
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob); a.download=name; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      }
      toast(name+" gesichert");
    }catch(e){ toast("Nicht gesichert"); }
  }
  document.getElementById("btnStand").onclick=standSichern;
  // Geblättert wird mit der Tastatur oder dem Presenter, der meist Bild auf und Bild ab sendet.
  function wechseln(um){
    const liste=wgListe();
    const stationen=["einrichtung"].concat(liste.map(x=>x.id), ["protokoll"]);
    const jetzt = S.ansicht==="einrichtung" ? 0
                : S.ansicht==="protokoll"   ? stationen.length-1
                : Math.max(0, liste.findIndex(x=>x.id===S.aktiv))+1;
    const ziel = jetzt+um;
    if(ziel<0 || ziel>=stationen.length) return;     // kein Rundlauf
    const id=stationen[ziel];
    if(id==="einrichtung" || id==="protokoll") S.ansicht=id;
    else { S.aktiv=id; S.ansicht="wahlgang"; }
    sichern(); zeichnen(); window.scrollTo(0,0);
  }
  document.addEventListener("keydown",e=>{
    const imFeld=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
    if(e.key==="PageDown" || (e.key==="ArrowRight" && !imFeld)){ e.preventDefault(); wechseln(1); }
    if(e.key==="PageUp"   || (e.key==="ArrowLeft"  && !imFeld)){ e.preventDefault(); wechseln(-1); }
    if((e.ctrlKey||e.metaKey) && !e.altKey && e.key.toLowerCase()==="s"){
      e.preventDefault(); standSichern();
    }
  });

  wiederherstellen();
  grossPruefen();
  zeichnen();
  verbinden();
})();
</script>
